name: Apply reviewed RunnerLoom merge-gate fixes

on:
  push:
    branches: [fix/runnerloom-merge-gates-20260909]

permissions:
  contents: read

jobs:
  validate-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.1'
          cache: true
      - name: Apply the checked patch to the exact expected PR head
        run: |
          set -euo pipefail
          base64 --decode merge-gates.patch.gz.b64 | gzip -d > "$RUNNER_TEMP/merge-gates.patch"
          printf '742c208cfc932fe7a30fbc0355f62d53bc738f630dd4f88854fe3c86daa6b60c  %s\n' "$RUNNER_TEMP/merge-gates.patch" | sha256sum --check -
          git checkout --detach 06f043b58d2285594d70a4cbb4bb85cb75d18d9e
          git apply --index "$RUNNER_TEMP/merge-gates.patch"
          git diff --cached --check
          git -c user.name='RunnerLoom CI' -c user.email='noreply@github.com' commit -m 'fix: close CI capacity and release-review gates with regression tests'
      - name: Validate the exact patched source before publishing
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          go test -race -count=1 ./...
          for s in internal/cli/image-build.sh scripts/ci-vm-smoke.sh scripts/ci-free-space.sh; do bash -n "$s"; done
          python3.12 -c 'import sys; assert sys.version_info[:2] == (3, 12)'
          go mod vendor
          python3.12 scripts/package.py --deb
          python3.12 scripts/test_package.py dist
          git diff --exit-code
      - name: Publish only the validated patch, without force or workflow changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual=$(gh api repos/MOVEI144/RunnerLoom/git/ref/heads/test/runnerloom-e2e-20260909 --jq .object.sha)
          test "$actual" = 06f043b58d2285594d70a4cbb4bb85cb75d18d9e
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin HEAD:refs/heads/test/runnerloom-e2e-20260909
          printf 'Validated patch committed to PR #6: `%s`. Full VM CI and review gates are still required before merging.\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
