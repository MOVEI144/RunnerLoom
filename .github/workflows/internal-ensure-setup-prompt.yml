name: Internal ensure setup prompt hardening

on:
  push:
    branches: [feat/interactive-cli-rc4]
    paths:
      - .github/workflows/internal-ensure-setup-prompt.yml

permissions:
  actions: write
  contents: write

jobs:
  ensure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Cancel superseded setup hardening run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: MOVEI144/RunnerLoom
          BRANCH: feat/interactive-cli-rc4
        run: |
          set -euo pipefail
          gh run list --repo "$REPO" --branch "$BRANCH" --limit 100 --json databaseId,name,status \
            | jq -r '.[] | select(.name == "Internal harden setup prompt" and (.status == "queued" or .status == "in_progress" or .status == "pending" or .status == "waiting")) | .databaseId' \
            | while read -r run_id; do
                test -n "$run_id" && gh run cancel "$run_id" --repo "$REPO" || true
              done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/interactive-cli-rc4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true
      - name: Apply hardening on the latest branch head
        run: |
          set -euo pipefail
          git fetch origin feat/interactive-cli-rc4
          git reset --hard origin/feat/interactive-cli-rc4
          python3 - <<'PY'
          from pathlib import Path

          path = Path('internal/cli/setup.go')
          text = path.read_text(encoding='utf-8')
          old = 'fmt.Fprintf(a.Err, "%s [%s]: ", label, fallback)'
          new = 'fmt.Fprintf(a.Err, "%s [%s]: ", interactiveSafe(label), interactiveSafe(fallback))'
          if old in text:
              text = text.replace(old, new, 1)
          if new not in text:
              raise SystemExit('setup prompt hardening marker missing')
          path.write_text(text, encoding='utf-8')

          for name in (
              '.github/workflows/internal-harden-setup-prompt.yml',
              '.github/workflows/internal-ensure-setup-prompt.yml',
          ):
              Path(name).unlink(missing_ok=True)
          PY
          gofmt -w internal/cli/setup.go internal/cli/setup_prompt_security_gate_test.go
          go mod tidy
      - name: Verify the exact safety regression
        run: |
          set -euo pipefail
          git diff --check
          go test -race -count=1 ./internal/cli -run 'TestInteractiveReleaseGateSanitizesLegacySetupPrompt|TestInteractiveReleaseGateSanitizesDynamicConfirmation|TestInteractiveReleaseGateValidatesEnrollmentID'
          go vet ./...
      - name: Push the verified latest-head patch
        run: |
          set -euo pipefail
          git config user.name runnerloom-interactive-bot
          git config user.email '184829077+Aero123421@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(cli): finalize interactive prompt sanitization'
          git push origin HEAD:feat/interactive-cli-rc4
