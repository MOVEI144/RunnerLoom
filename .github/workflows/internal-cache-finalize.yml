name: Internal cache implementation finalize

on:
  push:
    branches:
      - feat/cache-lifecycle-management
    paths:
      - .github/workflows/internal-cache-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Integrate cache implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if text.count(old) != 1:
                  raise SystemExit(f"expected one replacement in {path}, found {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "internal/host/images.go",
              "type Images struct {\n\tDir      string\n\tLimitGiB int64\n\tExec     Executor",
              "type Images struct {\n\tDir        string\n\tLimitGiB   int64\n\tReserveGiB int64\n\tExec       Executor",
          )
          replace_once(
              "internal/host/images.go",
              "\tif i.LimitGiB < 1 || i.LimitGiB > 1048576 {\n\t\treturn \"\", errors.New(\"invalid image cache limit\")\n\t}",
              "\tif e = validateCachePolicy(i.effectiveCacheLimitGiB(), i.effectiveCacheReserveGiB()); e != nil {\n\t\treturn \"\", e\n\t}",
          )
          replace_once(
              "internal/host/images.go",
              "\tavailable := i.LimitGiB*(1<<30) - used\n\tif available <= 0 {\n\t\treturn \"\", errors.New(\"image cache capacity exhausted\")\n\t}",
              "\tavailable, e := i.importBudgetBytes(used)\n\tif e != nil {\n\t\treturn \"\", e\n\t}",
          )
          replace_once(
              "internal/cli/cli.go",
              "\ta.addMaintenance(root)\n\ta.addSetup(root)",
              "\ta.addMaintenance(root)\n\ta.addCache(root)\n\ta.addSetup(root)",
          )
          replace_once(
              "internal/host/cache_test.go",
              "import (\n\t\"bytes\"\n\t\"context\"",
              "import (\n\t\"bytes\"\n\t\"context\"\n\t\"encoding/json\"",
          )

          p = Path("internal/host/cache.go")
          text = p.read_text()
          old = '''\t\tif options.Verify && entry.Integrity != "unsafe" {\n\t\t\tactual, stamp, verifyErr := hashFile(full)\n\t\t\tswitch {\n\t\t\tcase verifyErr != nil:\n\t\t\t\tentry.Integrity = "unreadable"\n\t\t\t\tentry.IntegrityError = verifyErr.Error()\n\t\t\tcase actual != digest:\n\t\t\t\tentry.Integrity = "digest-mismatch"\n\t\t\t\tentry.IntegrityError = "file SHA-256 differs from its content-addressed name"\n\t\t\tcase i.inspect(ctx, full) != nil:\n\t\t\t\tinspectErr := i.inspect(ctx, full)\n\t\t\t\tentry.Integrity = "invalid-qcow2"\n\t\t\t\tentry.IntegrityError = inspectErr.Error()\n\t\t\tdefault:\n\t\t\t\tentry.Integrity = "valid"\n\t\t\t\tif i.verified == nil {\n\t\t\t\t\ti.verified = map[string]imageStamp{}\n\t\t\t\t}\n\t\t\t\ti.verified[digest] = stamp\n\t\t\t}\n'''
          new = '''\t\tif options.Verify && entry.Integrity != "unsafe" {\n\t\t\tactual, stamp, verifyErr := hashFile(full)\n\t\t\tif verifyErr != nil {\n\t\t\t\tentry.Integrity = "unreadable"\n\t\t\t\tentry.IntegrityError = verifyErr.Error()\n\t\t\t} else if actual != digest {\n\t\t\t\tentry.Integrity = "digest-mismatch"\n\t\t\t\tentry.IntegrityError = "file SHA-256 differs from its content-addressed name"\n\t\t\t} else if inspectErr := i.inspect(ctx, full); inspectErr != nil {\n\t\t\t\tentry.Integrity = "invalid-qcow2"\n\t\t\t\tentry.IntegrityError = inspectErr.Error()\n\t\t\t} else {\n\t\t\t\tentry.Integrity = "valid"\n\t\t\t\tif i.verified == nil {\n\t\t\t\t\ti.verified = map[string]imageStamp{}\n\t\t\t\t}\n\t\t\t\ti.verified[digest] = stamp\n\t\t\t}\n'''
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit("could not normalize cache verification block")
              p.write_text(text.replace(old, new, 1))

          checker = Path("scripts/check-docs.py")
          checker_text = checker.read_text()
          cache_doc = '    ROOT / "docs" / "CACHE_MANAGEMENT.ja.md",\n'
          if cache_doc not in checker_text:
              marker = '    ROOT / "docs" / "TROUBLESHOOTING.ja.md",\n'
              if marker not in checker_text:
                  raise SystemExit("documentation list marker missing")
              checker.write_text(checker_text.replace(marker, marker + cache_doc, 1))

          readme = Path("README.md")
          readme_text = readme.read_text()
          if "## Image cacheの管理" not in readme_text:
              marker = "## 安全性と対応範囲\n"
              section = '''## Image cacheの管理\n\nGolden ImageはControllerと各Nodeのcontent-addressed cacheへ保存され、Jobごとのqcow2 overlayだけが終了後に削除されます。RunnerLoomは稼働中backing Imageを推測で消しません。\n\n`runnerloom cache status`、`cache verify`、dry-run既定の`cache prune`、明示的な`cache quarantine`で、容量、SHA-256、qcow2構造、catalog、VM manifest、base hard link、overlay参照を確認できます。詳細は [Golden Image cacheの管理](docs/CACHE_MANAGEMENT.ja.md) を参照してください。\n\n'''
              if marker not in readme_text:
                  raise SystemExit("README cache insertion marker missing")
              readme.write_text(readme_text.replace(marker, section + marker, 1))

          docs_index = Path("docs/README.md")
          index_text = docs_index.read_text()
          if "CACHE_MANAGEMENT.ja.md" not in index_text:
              marker = "## 設計・安全性・検証\n"
              section = '''## Cacheと容量\n\n| 目的 | 文書 |\n|---|---|\n| Golden Imageの保存場所、容量上限、完全検証、安全なprune、破損時のquarantine | [CACHE_MANAGEMENT.ja.md](CACHE_MANAGEMENT.ja.md) |\n\n'''
              if marker not in index_text:
                  raise SystemExit("docs index insertion marker missing")
              docs_index.write_text(index_text.replace(marker, section + marker, 1))

          quick = Path("docs/QUICKSTART.ja.md")
          quick_text = quick.read_text()
          if "cache status --node-config" not in quick_text:
              marker = "## 6. GitHub接続を確認し、serviceを起動する\n"
              section = '''### 5-4. Cache容量を確認する\n\n```bash\nsudo runnerloom cache status \\\n  --node-config "$RL_NODE_STATE/agent.json" \\\n  --json\n```\n\nNode cacheの上限、filesystemの空き、Image参照、hard linkを確認します。古いImageの整理と破損対応は [Golden Image cacheの管理](CACHE_MANAGEMENT.ja.md) を参照してください。\n\n'''
              if marker not in quick_text:
                  raise SystemExit("quickstart cache insertion marker missing")
              quick.write_text(quick_text.replace(marker, section + marker, 1))

          operations = Path("docs/OPERATIONS.ja.md")
          operations_text = operations.read_text()
          if "## Golden Image cacheの点検と整理" not in operations_text:
              marker = "## Controller DBの安全な整理\n"
              section = '''## Golden Image cacheの点検と整理\n\n日常点検はserviceを止めずに実行できます。\n\n```bash\nsudo runnerloom cache status --state "$RL_CONTROLLER_STATE" --json\nsudo runnerloom cache status --node-config "$RL_NODE_CONFIG" --json\n```\n\n定期的な完全検証ではSHA-256とqcow2構造も確認します。\n\n```bash\nsudo runnerloom cache verify --state "$RL_CONTROLLER_STATE" --json\nsudo runnerloom cache verify --node-config "$RL_NODE_CONFIG" --json\n```\n\n整理は必ずdry-runを読み、対象serviceを停止してから`--apply`します。active VM、現在のcatalog、VM manifest、overlay、所有不明hard linkが参照するImageは削除されません。破損Imageは自動削除せず、明示的な`cache quarantine`で隔離します。詳細は [CACHE_MANAGEMENT.ja.md](CACHE_MANAGEMENT.ja.md) を参照してください。\n\n'''
              if marker not in operations_text:
                  raise SystemExit("operations cache insertion marker missing")
              operations.write_text(operations_text.replace(marker, section + marker, 1))

          troubleshooting = Path("docs/TROUBLESHOOTING.ja.md")
          troubleshooting_text = troubleshooting.read_text()
          if "## 14. Image cacheが満杯または破損している" not in troubleshooting_text:
              marker = "## 調査情報を保存する\n"
              section = '''## 14. Image cacheが満杯または破損している\n\n### `image cache capacity exhausted` / `filesystem safety reserve exhausted`\n\n```bash\nsudo runnerloom cache status --node-config "$RL_NODE_CONFIG" --verify --json\nsudo runnerloom cache prune --node-config "$RL_NODE_CONFIG" --json\n```\n\n`candidateEntries`と`references`を確認します。適用時はAgentを停止し、同じコマンドへ`--apply`を追加します。容量上限を増やすだけでなく、VM storageと同じfilesystemの実空きも確認してください。\n\n### `CACHE_INTEGRITY`\n\n破損digestを確認し、active VMと想定外hard linkがない状態で、service停止後に`cache quarantine DIGEST --apply`を実行します。Nodeは必要Imageを再downloadし、Controller cacheは元Imageを再importします。validなImageをquarantineすることはできません。詳しい手順は [CACHE_MANAGEMENT.ja.md](CACHE_MANAGEMENT.ja.md) を参照してください。\n\n'''
              if marker not in troubleshooting_text:
                  raise SystemExit("troubleshooting cache insertion marker missing")
              troubleshooting.write_text(troubleshooting_text.replace(marker, section + marker, 1))

          version = Path("VERSION")
          version.write_text("0.1.0-rc.3\n")

          changelog = Path("CHANGELOG.md")
          change_text = changelog.read_text()
          if "## 0.1.0-rc.3" not in change_text:
              marker = "# Changelog\n"
              entry = '''# Changelog\n\n## 0.1.0-rc.3 - 2026-09-11\n\n### Added\n\n- `runnerloom cache status` and `cache verify` for logical usage, real filesystem headroom, SHA-256, qcow2 structure, references, inode and hard-link visibility.\n- Dry-run-first `cache prune` that removes only fully verified, unreferenced images and old RunnerLoom temporary files while preserving active/unknown VM state.\n- Explicit offline `cache quarantine` for corrupt images; bytes are moved to an owner-only directory instead of being silently deleted.\n- Node-side reconciliation of catalog, durable VM manifests, base links and real qcow2 overlay backing references.\n- Image-import filesystem safety reserve in addition to the logical cache limit.\n- A dedicated Japanese cache-management guide and cache checks in Quick Start, operations and troubleshooting documentation.\n\n### Safety\n\n- Cache mutation requires the relevant Controller or Agent process lock and revalidates digest, qcow2 format, inode and hard-link count immediately before removal.\n- Unknown files, valid referenced images, unexpected links, invalid manifests and uninspectable overlays are never guessed away.\n'''
              if marker not in change_text:
                  raise SystemExit("CHANGELOG heading missing")
              changelog.write_text(change_text.replace(marker, entry, 1))
          PY

          gofmt -w internal/host/cache.go internal/host/cache_test.go internal/host/images.go internal/cli/cache.go internal/cli/cache_command_test.go internal/cli/cli.go
          python3 scripts/check-docs.py
          git diff --check

      - name: Validate implementation
        shell: bash
        run: |
          set -euo pipefail
          go vet ./...
          go test -count=1 ./...
          go test -race -count=1 ./internal/host ./internal/cli

      - name: Commit validated implementation and remove internal workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/internal-cache-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md VERSION docs scripts internal
          git commit -m "feat(cache): add safe image cache lifecycle management"
          git push origin HEAD:feat/cache-lifecycle-management
