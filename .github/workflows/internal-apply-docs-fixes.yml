name: Internal apply documentation fixes

on:
  push:
    branches:
      - docs/clarify-readme-and-setup-20260910
    paths:
      - .github/internal/docs-fixes.patch
      - .github/workflows/internal-apply-docs-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/clarify-readme-and-setup-20260910
          fetch-depth: 0
      - name: Apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/internal/docs-fixes.patch
          git apply .github/internal/docs-fixes.patch
          rm -f .github/internal/docs-fixes.patch
          rm -f .github/workflows/internal-apply-docs-fixes.yml
          rm -f .github/workflows/internal-source-export.yml
          rmdir .github/internal 2>/dev/null || true
          python3 scripts/check-docs.py
          git diff --check
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "runnerloom-docs-bot"
          git config user.email "184829077+Aero123421@users.noreply.github.com"
          git add -A
          git commit -m "docs: address final review findings"
          git push origin HEAD:docs/clarify-readme-and-setup-20260910
