name: Internal cache integrity finalization

on:
  push:
    branches:
      - feat/cache-lifecycle-management
    paths:
      - .github/workflows/internal-cache-integrity-final.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Finalize missing-image, orphan-link and quarantine safety
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          cache = Path("internal/host/cache.go")
          text = cache.read_text()

          # Track every published digest so required-but-missing images and
          # orphan base links become explicit integrity failures.
          old = '''\tentries, err := os.ReadDir(i.Dir)\n\tif err != nil {\n\t\treturn report, err\n\t}\n\tfor _, dirEntry := range entries {\n'''
          new = '''\tentries, err := os.ReadDir(i.Dir)\n\tif err != nil {\n\t\treturn report, err\n\t}\n\tseenDigests := map[string]bool{}\n\tfor _, dirEntry := range entries {\n'''
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit("cache scan digest marker missing")
              text = text.replace(old, new, 1)

          old = '''\t\tdigest, published := cacheDigestFromName(name)\n\t\tif !published {\n'''
          new = '''\t\tdigest, published := cacheDigestFromName(name)\n\t\tif !published {\n'''
          # No textual change here; insertion happens after the unknown branch.
          if old not in text:
              raise SystemExit("published image marker missing")

          marker = '''\t\tentry := CacheEntry{Digest: digest, Name: name, Modified: st.ModTime(), Integrity: "unchecked", References: uniqueSorted(refs[digest]), cachePath: full}\n'''
          replacement = '''\t\tseenDigests[digest] = true\n\t\tentry := CacheEntry{Digest: digest, Name: name, Modified: st.ModTime(), Integrity: "unchecked", References: uniqueSorted(refs[digest]), cachePath: full}\n'''
          if replacement not in text:
              if text.count(marker) != 1:
                  raise SystemExit("cache entry construction marker missing")
              text = text.replace(marker, replacement, 1)

          sort_marker = '''\tsort.Slice(report.Entries, func(a, b int) bool { return report.Entries[a].Digest < report.Entries[b].Digest })\n'''
          missing_block = '''\tfor digest, references := range refs {\n\t\tif seenDigests[digest] {\n\t\t\tcontinue\n\t\t}\n\t\tname, nameErr := imageName(digest)\n\t\tif nameErr != nil {\n\t\t\treturn report, nameErr\n\t\t}\n\t\treport.InvalidEntries++\n\t\treport.Entries = append(report.Entries, CacheEntry{\n\t\t\tDigest: digest, Name: name, Integrity: "missing",\n\t\t\tIntegrityError: "referenced image is missing from the content-addressed cache",\n\t\t\tReferences: uniqueSorted(references),\n\t\t\tBlockedReason: "restore or re-download the referenced image",\n\t\t})\n\t}\n\tif options.DiskDir != "" {\n\t\tbaseDir := filepath.Join(options.DiskDir, "base")\n\t\tbaseEntries, baseErr := os.ReadDir(baseDir)\n\t\tif baseErr != nil && !os.IsNotExist(baseErr) {\n\t\t\treturn report, baseErr\n\t\t}\n\t\tfor _, baseEntry := range baseEntries {\n\t\t\tbasePath := filepath.Join(baseDir, baseEntry.Name())\n\t\t\tbaseStat, statErr := os.Lstat(basePath)\n\t\t\tif statErr != nil {\n\t\t\t\treturn report, statErr\n\t\t\t}\n\t\t\tdigest, validName := cacheDigestFromName(baseEntry.Name())\n\t\t\tif !validName || !baseStat.Mode().IsRegular() {\n\t\t\t\treport.UnsafeEntries++\n\t\t\t\treport.Auxiliary = append(report.Auxiliary, CacheAuxEntry{Name: filepath.Join("base", baseEntry.Name()), Kind: "unsafe-base", SizeBytes: baseStat.Size(), Modified: baseStat.ModTime(), Reason: "base directory contains an invalid entry", path: basePath})\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\tif seenDigests[digest] {\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\t_, allocated := cacheFileUsage(baseStat)\n\t\t\treport.UnsafeEntries++\n\t\t\treport.Auxiliary = append(report.Auxiliary, CacheAuxEntry{Name: filepath.Join("base", baseEntry.Name()), Kind: "orphan-base", SizeBytes: baseStat.Size(), AllocatedBytes: allocated, Modified: baseStat.ModTime(), Reason: "base image has no matching private cache entry and is never auto-deleted", path: basePath})\n\t\t}\n\t}\n'''
          if missing_block not in text:
              if text.count(sort_marker) != 1:
                  raise SystemExit("cache sort marker missing")
              text = text.replace(sort_marker, missing_block + sort_marker, 1)

          # Dry-run quarantine must not create an absent cache directory.
          old = '''\toptions.Verify = true\n\tif err := core.PrivateDir(i.Dir); err != nil {\n\t\treturn CacheQuarantineReport{}, err\n\t}\n\tvar lock *core.Lock\n'''
          new = '''\toptions.Verify = true\n\texists, err := checkExistingPrivateDirectory(i.Dir)\n\tif err != nil {\n\t\treturn CacheQuarantineReport{}, err\n\t}\n\tif !exists {\n\t\treturn CacheQuarantineReport{}, errors.New("image cache directory does not exist")\n\t}\n\tvar lock *core.Lock\n'''
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit("quarantine directory marker missing")
              text = text.replace(old, new, 1)

          # A corrupt catalog-required image may still have RunnerLoom's normal
          # base hard link. With no active instance/overlay references, remove
          # that owned link before quarantining the private inode.
          old = '''\tif !apply {\n\t\treturn result, nil\n\t}\n\tbaseRemoved, err := removeStaleBaseLink(*entry)\n'''
          new = '''\tif entry.cachePath == "" {\n\t\treturn result, errors.New("a missing cache image cannot be quarantined")\n\t}\n\tif !apply {\n\t\treturn result, nil\n\t}\n\townedBase := *entry\n\townedBase.StaleBaseLink = ownedBase.BaseLink\n\tbaseRemoved, err := removeStaleBaseLink(ownedBase)\n'''
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit("quarantine base-link marker missing")
              text = text.replace(old, new, 1)

          cache.write_text(text)

          tests = Path("internal/host/cache_test.go")
          test_text = tests.read_text()
          additions = r'''
func TestCacheStatusReportsReferencedImageMissing(t *testing.T) {
	root := t.TempDir()
	images := &Images{Dir: filepath.Join(root, "images"), LimitGiB: 1, ReserveGiB: 1, Exec: &fakeHost{}}
	if err := core.PrivateDir(images.Dir); err != nil {
		t.Fatal(err)
	}
	digest := "sha256:" + strings.Repeat("c", 64)
	report, err := images.CacheStatus(context.Background(), CacheScanOptions{Required: map[string][]string{digest: {"pool:linux-lite"}}, Verify: true})
	if err != nil {
		t.Fatal(err)
	}
	if report.Healthy || report.InvalidEntries != 1 || len(report.Entries) != 1 || report.Entries[0].Integrity != "missing" {
		t.Fatalf("missing required image was not reported: %+v", report)
	}
}

func TestCacheStatusReportsOrphanBase(t *testing.T) {
	root := t.TempDir()
	state := filepath.Join(root, "state")
	disk := filepath.Join(root, "disk")
	if err := core.PrivateDir(filepath.Join(state, "images")); err != nil {
		t.Fatal(err)
	}
	if err := os.MkdirAll(filepath.Join(disk, "base"), 0700); err != nil {
		t.Fatal(err)
	}
	orphan := filepath.Join(disk, "base", strings.Repeat("d", 64)+".qcow2")
	if err := os.WriteFile(orphan, []byte("orphan"), 0444); err != nil {
		t.Fatal(err)
	}
	images := &Images{Dir: filepath.Join(state, "images"), LimitGiB: 1, ReserveGiB: 1, Exec: &fakeHost{}}
	report, err := images.CacheStatus(context.Background(), CacheScanOptions{StateDir: state, DiskDir: disk, Verify: true})
	if err != nil {
		t.Fatal(err)
	}
	if report.Healthy || report.UnsafeEntries != 1 || len(report.Auxiliary) != 1 || report.Auxiliary[0].Kind != "orphan-base" {
		t.Fatalf("orphan base was not reported: %+v", report)
	}
}

func TestCacheQuarantineDryRunDoesNotCreateDirectory(t *testing.T) {
	dir := filepath.Join(t.TempDir(), "missing-cache")
	images := &Images{Dir: dir, LimitGiB: 1, ReserveGiB: 1, Exec: &fakeHost{}}
	digest := "sha256:" + strings.Repeat("e", 64)
	if _, err := images.QuarantineCache(context.Background(), digest, CacheScanOptions{}, false); err == nil {
		t.Fatal("missing cache directory was accepted")
	}
	if _, err := os.Stat(dir); !os.IsNotExist(err) {
		t.Fatal("quarantine dry-run created a cache directory")
	}
}

func TestCacheQuarantineRemovesOwnedBaseForCatalogImage(t *testing.T) {
	root := t.TempDir()
	state := filepath.Join(root, "state")
	disk := filepath.Join(root, "disk")
	if err := core.PrivateDir(state); err != nil {
		t.Fatal(err)
	}
	if err := os.MkdirAll(filepath.Join(disk, "base"), 0700); err != nil {
		t.Fatal(err)
	}
	images := &Images{Dir: filepath.Join(state, "images"), LimitGiB: 1, ReserveGiB: 1, Exec: &fakeHost{}}
	digest, cachePath := importCacheFixture(t, images, "CATALOG_CORRUPT")
	basePath := filepath.Join(disk, "base", strings.TrimPrefix(digest, "sha256:")+".qcow2")
	if err := os.Link(cachePath, basePath); err != nil {
		t.Fatal(err)
	}
	if err := os.WriteFile(cachePath, []byte("corrupt"), 0600); err != nil {
		t.Fatal(err)
	}
	result, err := images.QuarantineCache(context.Background(), digest, CacheScanOptions{DiskDir: disk, Required: map[string][]string{digest: {"catalog:ubuntu-24"}}}, true)
	if err != nil {
		t.Fatal(err)
	}
	if !result.Applied || !result.RemovedBaseLink {
		t.Fatalf("owned base was not removed during quarantine: %+v", result)
	}
	if _, err = os.Stat(basePath); !os.IsNotExist(err) {
		t.Fatal("catalog image base link remained after quarantine")
	}
	if _, err = os.Stat(result.Destination); err != nil {
		t.Fatal("quarantined bytes are missing")
	}
}
'''
          if "TestCacheStatusReportsReferencedImageMissing" not in test_text:
              tests.write_text(test_text + additions)

          docs = Path("docs/CACHE_MANAGEMENT.ja.md")
          doc_text = docs.read_text()
          if "orphan-base" not in doc_text:
              marker = "## Cacheが満杯になった場合\n"
              note = "## 不足Imageと孤立baseの扱い\n\n現在のPool、Node catalog、未完了VMが参照するdigestがprivate cacheにない場合、`cache verify`は`missing`として失敗します。また、`<disk-dir>/base`だけに残ったImageは`orphan-base`として表示し、自動削除しません。先にVM manifestとoverlayの実状態を照合してください。\n\n"
              if marker not in doc_text:
                  raise SystemExit("cache documentation marker missing")
              docs.write_text(doc_text.replace(marker, note + marker, 1))
          PY

          gofmt -w internal/host/cache.go internal/host/cache_test.go
          python3 scripts/check-docs.py
          git diff --check
      - name: Validate complete repository
        shell: bash
        run: |
          set -euo pipefail
          go vet ./...
          go test -count=1 ./...
          go test -race -count=1 ./internal/host ./internal/cli ./internal/core
      - name: Commit final tree and remove internal workflows
        shell: bash
        run: |
          set -euo pipefail
          for workflow in \
            .github/workflows/internal-cache-finalize.yml \
            .github/workflows/internal-cache-polish.yml \
            .github/workflows/internal-cache-audit-fix.yml \
            .github/workflows/internal-cache-integrity-final.yml; do
            if test -f "$workflow"; then git rm -f "$workflow"; fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs internal .github/workflows
          git commit -m "fix(cache): report missing and orphaned image state safely"
          git push origin HEAD:feat/cache-lifecycle-management
