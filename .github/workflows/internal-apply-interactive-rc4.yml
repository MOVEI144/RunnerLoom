name: Internal apply interactive CLI

on:
  push:
    branches: [feat/interactive-cli-rc4]
    paths:
      - scripts/apply-interactive-rc4.py
      - .github/workflows/internal-apply-interactive-rc4.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/interactive-cli-rc4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true
      - name: Apply integration and documentation changes
        run: python3 scripts/apply-interactive-rc4.py
      - name: Format and synchronize modules
        run: |
          gofmt -w internal/cli/cli.go internal/cli/interactive.go internal/cli/interactive_test.go
          go mod tidy
      - name: Validate documentation and diff
        run: |
          python3 scripts/check-docs.py
          git diff --check
      - name: Vet and test
        run: |
          go vet ./...
          go test -race -count=1 ./...
      - name: Verify release packaging
        run: |
          python3 scripts/package.py --deb
          python3 scripts/test_package.py dist
      - name: Commit verified implementation
        env:
          BRANCH: feat/interactive-cli-rc4
        run: |
          set -euo pipefail
          git config user.name runnerloom-interactive-bot
          git config user.email '184829077+Aero123421@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test -n "$(git status --porcelain)"
          git commit -m 'feat(cli): add interactive operator mode'
          git push origin "HEAD:$BRANCH"
