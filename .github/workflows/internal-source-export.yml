name: Internal source export

on:
  push:
    branches:
      - docs/clarify-readme-and-setup-20260910
      - feat/cache-lifecycle-management
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Remove Git metadata
        run: rm -rf .git
      - name: Upload private source snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-${{ github.sha }}
          path: .
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
