name: Internal source export

on:
  push:
    branches: [feat/interactive-cli]
    paths:
      - .github/workflows/internal-source-export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Package source
        run: |
          set -euo pipefail
          tar --exclude=.git -czf "$RUNNER_TEMP/runnerloom-source.tar.gz" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-${{ github.sha }}
          path: ${{ runner.temp }}/runnerloom-source.tar.gz
          retention-days: 1
          if-no-files-found: error
