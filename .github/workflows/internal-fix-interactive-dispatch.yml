name: Internal fix interactive dispatch

on:
  push:
    branches: [feat/interactive-cli-rc4]
    paths:
      - .github/workflows/internal-fix-interactive-dispatch.yml

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/interactive-cli-rc4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true
      - name: Make nested dispatch explicitly non-interactive
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('internal/cli/interactive.go')
          text = path.read_text(encoding='utf-8')
          old = '''\tif !containsStateFlag(args) {\n\t\tfull = append(full, "--state", a.State)\n\t}\n\tfull = append(full, args...)\n'''
          new = '''\tif !containsStateFlag(args) {\n\t\tfull = append(full, "--state", a.State)\n\t}\n\tif !allowPrompts {\n\t\tfull = append(full, "--non-interactive")\n\t}\n\tfull = append(full, args...)\n'''
          if old not in text:
              if new not in text:
                  raise SystemExit('interactive dispatch marker missing')
          else:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/internal-fix-interactive-dispatch.yml').unlink()
          PY
          gofmt -w internal/cli/interactive.go
          go mod tidy
      - name: Validate
        run: |
          python3 scripts/check-docs.py
          git diff --check
          go vet ./...
          go test -race -count=1 ./...
      - name: Commit verified fix
        env:
          BRANCH: feat/interactive-cli-rc4
        run: |
          set -euo pipefail
          git config user.name runnerloom-interactive-bot
          git config user.email '184829077+Aero123421@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(cli): keep nested menu dispatch non-interactive'
          git push origin "HEAD:$BRANCH"
