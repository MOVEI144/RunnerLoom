name: RunnerLoom v1 live acceptance

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Acceptance lane to run
        required: true
        type: choice
        default: full
        options:
          - full
          - cancellation

permissions:
  contents: read

concurrency:
  group: runnerloom-v1-live-acceptance
  cancel-in-progress: false

jobs:
  standard:
    name: Live standard runner ${{ matrix.slot }}
    if: inputs.mode == 'full'
    runs-on: r5gh-linux-standard
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        slot: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Record runner and VM environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p acceptance-evidence
          {
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'runner_name=%s\n' "$RUNNER_NAME"
            printf 'runner_os=%s\n' "$RUNNER_OS"
            printf 'runner_arch=%s\n' "$RUNNER_ARCH"
            printf 'kernel=%s\n' "$(uname -srmo)"
            printf 'virtualization=%s\n' "$(systemd-detect-virt || true)"
            printf 'cpus=%s\n' "$(nproc)"
            awk '/MemTotal/ {print "memory_kib=" $2}' /proc/meminfo
            df -B1 / | awk 'NR == 2 {print "root_bytes=" $2; print "root_available_bytes=" $4}'
          } | tee acceptance-evidence/environment.txt
      - name: Exercise CPU, disk, artifact staging and public HTTPS
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,pathlib
          payload=bytes(range(256))*(128*1024)
          path=pathlib.Path('acceptance-evidence/cpu-and-disk.bin')
          path.write_bytes(payload)
          pathlib.Path('acceptance-evidence/workload.txt').write_text(
              f'bytes={len(payload)}\nsha256={hashlib.sha256(payload).hexdigest()}\n'
          )
          assert hashlib.sha256(path.read_bytes()).digest()==hashlib.sha256(payload).digest()
          path.unlink()
          PY
          curl --fail --silent --show-error --retry 2 --connect-timeout 10 \
            https://api.github.com/meta -o acceptance-evidence/github-meta.json
          test -s acceptance-evidence/github-meta.json
          sleep 20
      - name: Upload standard acceptance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v1-standard-${{ matrix.slot }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: acceptance-evidence/
          retention-days: 30
          if-no-files-found: error

  large:
    name: Live large runner
    if: inputs.mode == 'full'
    needs: standard
    runs-on: r5gh-linux-large
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify large-pool resources and workload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p acceptance-evidence
          cpus=$(nproc)
          memory_kib=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          test "$cpus" -eq 8
          test "$memory_kib" -ge 15000000
          {
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'runner_name=%s\n' "$RUNNER_NAME"
            printf 'runner_os=%s\n' "$RUNNER_OS"
            printf 'runner_arch=%s\n' "$RUNNER_ARCH"
            printf 'virtualization=%s\n' "$(systemd-detect-virt || true)"
            printf 'cpus=%s\n' "$cpus"
            printf 'memory_kib=%s\n' "$memory_kib"
            df -B1 / | awk 'NR == 2 {print "root_bytes=" $2; print "root_available_bytes=" $4}'
          } | tee acceptance-evidence/environment.txt
          dd if=/dev/zero of=acceptance-evidence/disk.bin bs=1M count=128 conv=fsync status=none
          sha256sum acceptance-evidence/disk.bin > acceptance-evidence/disk.sha256
          rm acceptance-evidence/disk.bin
          curl --fail --silent --show-error --retry 2 --connect-timeout 10 \
            https://api.github.com/meta -o acceptance-evidence/github-meta.json
          test -s acceptance-evidence/github-meta.json
      - name: Upload large-pool evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v1-large-${{ github.run_id }}-${{ github.run_attempt }}
          path: acceptance-evidence/
          retention-days: 30
          if-no-files-found: error

  cancellation:
    name: External cancellation and cleanup probe
    if: inputs.mode == 'cancellation'
    runs-on: r5gh-linux-standard
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Record the active ephemeral runner before cancellation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p acceptance-evidence
          {
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'runner_name=%s\n' "$RUNNER_NAME"
            printf 'started_at=%s\n' "$(date -u +%FT%TZ)"
            printf 'instruction=cancel this workflow run while the next step is active\n'
          } | tee acceptance-evidence/cancellation-started.txt
      - name: Upload pre-cancellation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v1-cancellation-start-${{ github.run_id }}-${{ github.run_attempt }}
          path: acceptance-evidence/
          retention-days: 30
          if-no-files-found: error
      - name: Wait for an operator to cancel this run
        shell: bash
        run: |
          set -euo pipefail
          echo 'Cancel the workflow run now; then verify RunnerLoom removes the one-job VM and runner registration.'
          sleep 600
          echo 'Cancellation was not exercised.' >&2
          exit 1
