name: Internal finalize interactive CLI

on:
  push:
    branches: [feat/interactive-cli-rc4]
    paths:
      - .github/workflows/internal-finalize-interactive-rc4.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/interactive-cli-rc4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true
      - name: Complete integration if the first gate did not finish
        run: |
          set -euo pipefail
          if test -f scripts/apply-interactive-rc4.py; then
            python3 scripts/apply-interactive-rc4.py
          fi
          rm -f \
            .github/workflows/internal-apply-interactive-rc4.yml \
            .github/workflows/internal-finalize-interactive-rc4.yml \
            scripts/apply-interactive-rc4.py
          grep -F 'a.addInteractive(root)' internal/cli/cli.go
          grep -Fx '0.1.0-rc.4' VERSION
          test -f internal/cli/interactive.go
          test -f internal/cli/interactive_test.go
          test -f docs/INTERACTIVE_CLI.ja.md
      - name: Format and synchronize modules
        run: |
          gofmt -w internal/cli/cli.go internal/cli/interactive.go internal/cli/interactive_test.go
          go mod tidy
      - name: Validate documentation and repository diff
        run: |
          python3 scripts/check-docs.py
          git diff --check
          ! git grep -n 'internal-finalize-interactive-rc4\|internal-apply-interactive-rc4\|apply-interactive-rc4.py' -- ':!*.lock'
      - name: Vet and race-test the repository
        run: |
          go vet ./...
          go test -race -count=1 ./...
      - name: Verify release packages
        run: |
          python3 scripts/package.py --deb
          python3 scripts/test_package.py dist
      - name: Commit only the fully verified tree
        env:
          BRANCH: feat/interactive-cli-rc4
        run: |
          set -euo pipefail
          git config user.name runnerloom-interactive-bot
          git config user.email '184829077+Aero123421@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if test -n "$(git status --porcelain)"; then
            git commit -m 'test(cli): finalize verified interactive release candidate'
            git push origin "HEAD:$BRANCH"
          fi
