name: RunnerLoom live r5ghserver acceptance

on:
  push:
    branches: [acceptance/r5ghserver-20260910]

permissions:
  contents: read

concurrency:
  group: runnerloom-live-r5ghserver-acceptance
  cancel-in-progress: false

jobs:
  standard:
    name: Live ephemeral standard runner
    runs-on: r5gh-linux-standard
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Record runner and VM environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p acceptance-evidence
          {
            printf 'runner_name=%s\n' "$RUNNER_NAME"
            printf 'runner_os=%s\n' "$RUNNER_OS"
            printf 'runner_arch=%s\n' "$RUNNER_ARCH"
            printf 'kernel=%s\n' "$(uname -srmo)"
            printf 'virtualization=%s\n' "$(systemd-detect-virt || true)"
            printf 'cpus=%s\n' "$(nproc)"
            awk '/MemTotal/ {print "memory_kib=" $2}' /proc/meminfo
            df -B1 / | awk 'NR == 2 {print "root_bytes=" $2; print "root_available_bytes=" $4}'
          } | tee acceptance-evidence/environment.txt

      - name: Exercise CPU, disk and public HTTPS
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          payload = bytes(range(256)) * (128 * 1024)
          digest = hashlib.sha256(payload).hexdigest()
          with open('acceptance-evidence/cpu.txt', 'w') as f:
              f.write(f'bytes={len(payload)}\nsha256={digest}\n')
          PY
          dd if=/dev/zero of=acceptance-evidence/disk.bin bs=1M count=64 conv=fsync status=none
          sha256sum acceptance-evidence/disk.bin > acceptance-evidence/disk.sha256
          rm acceptance-evidence/disk.bin
          curl --fail --silent --show-error --retry 2 --connect-timeout 10 \
            https://api.github.com/meta -o acceptance-evidence/github-meta.json
          test -s acceptance-evidence/github-meta.json

      - name: Upload acceptance evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: r5ghserver-acceptance-${{ github.run_id }}
          path: acceptance-evidence/
          retention-days: 14
          if-no-files-found: error
