name: Apply reviewed runtime fixes
on:
  push:
    branches: [fix/runnerloom-reservations-isolation]
    paths: ['.github/maintenance/reviewed-fixes.patch', '.github/workflows/apply-reviewed-fixes.yml']
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'MOVEI144/RunnerLoom' && github.ref == 'refs/heads/fix/runnerloom-reservations-isolation'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.1'
          cache: true
      - name: Apply reviewed source-only patch without changing guest boot
        shell: bash
        run: |
          set -euo pipefail
          sed 's/^ diff --git /diff --git /' .github/maintenance/reviewed-fixes.patch > "$RUNNER_TEMP/fixes.patch"
          args=(--exclude=internal/host/provider.go --exclude=internal/host/guest_service_test.go)
          git apply --check "${args[@]}" "$RUNNER_TEMP/fixes.patch"
          git apply --index "${args[@]}" "$RUNNER_TEMP/fixes.patch"
          if git diff --cached --name-only | grep -vE '^internal/(core|host)/[a-z_]+\.go$'; then exit 1; fi
          test -z "$(gofmt -l internal)"
          go vet ./...
          go test -race -count=1 ./...
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve dedicated resource slots and verify VM network security policy'
          git push origin HEAD:refs/heads/fix/runnerloom-reservations-isolation
