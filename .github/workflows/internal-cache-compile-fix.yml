name: Internal final cache compile fix

on:
  push:
    branches:
      - feat/cache-lifecycle-management
    paths:
      - .github/workflows/internal-cache-compile-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Create idempotent correction
        shell: bash
        run: |
          cat > /tmp/cache-compile-fix.py <<'PY'
          from pathlib import Path

          cache = Path("internal/host/cache.go")
          text = cache.read_text()

          # checkExistingPrivateDirectory introduces err in function scope; do
          # not redeclare it immediately before the apply-only cache lock.
          text = text.replace(
              '''\tvar lock *core.Lock\n\tvar err error\n\tif apply {\n''',
              '''\tvar lock *core.Lock\n\tif apply {\n''',
              1,
          )

          # Keep lock/policy bookkeeping outside operator-visible managed data
          # usage, regardless of which internal finalizer won a concurrent push.
          helper_start = text.find("func managedUniqueAllocatedBytes(")
          if helper_start >= 0:
              helper_end = text.find("\nfunc syncDirectory(", helper_start)
              helper = text[helper_start:helper_end]
              exclusion = '''\t\t\tif entry.Name() == "image-cache.lock" || entry.Name() == ".runnerloom-cache-policy.json" {\n\t\t\t\treturn nil\n\t\t\t}\n'''
              if exclusion not in helper:
                  marker = '''\t\t\tif entry.IsDir() {\n\t\t\t\treturn nil\n\t\t\t}\n'''
                  if marker not in helper:
                      raise SystemExit("managed byte helper directory marker missing")
                  helper = helper.replace(marker, marker + exclusion, 1)
                  text = text[:helper_start] + helper + text[helper_end:]

          cache.write_text(text)
          PY
      - name: Rebase, correct, validate and publish
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            git fetch origin feat/cache-lifecycle-management
            git reset --hard origin/feat/cache-lifecycle-management
            python3 /tmp/cache-compile-fix.py
            gofmt -w internal/host/cache.go
            python3 scripts/check-docs.py
            git diff --check
            go vet ./...
            go test -count=1 ./...
            go test -race -count=1 ./internal/host ./internal/cli ./internal/core
            for workflow in \
              .github/workflows/internal-cache-finalize.yml \
              .github/workflows/internal-cache-polish.yml \
              .github/workflows/internal-cache-audit-fix.yml \
              .github/workflows/internal-cache-integrity-final.yml \
              .github/workflows/internal-cache-definitive.yml \
              .github/workflows/internal-cache-compile-fix.yml; do
              if test -f "$workflow"; then git rm -f "$workflow"; fi
            done
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/host/cache.go .github/workflows
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "fix(cache): finalize compile-safe accounting"
            if git push origin HEAD:feat/cache-lifecycle-management; then exit 0; fi
          done
          exit 1
