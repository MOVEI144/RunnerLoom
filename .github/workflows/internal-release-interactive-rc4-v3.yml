name: Internal release interactive CLI rc4 v3

on:
  push:
    branches: [feat/interactive-cli-rc4]
    paths:
      - .github/workflows/internal-release-interactive-rc4-v3.yml

permissions:
  actions: write
  checks: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: runnerloom-interactive-rc4-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Cancel superseded interactive helper runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: MOVEI144/RunnerLoom
          BRANCH: feat/interactive-cli-rc4
        run: |
          set -euo pipefail
          gh run list --repo "$REPO" --branch "$BRANCH" --limit 100 --json databaseId,name,status \
            | jq -r --argjson self "$GITHUB_RUN_ID" '.[] | select(.databaseId != $self and (.name | startswith("Internal ")) and (.status == "queued" or .status == "in_progress" or .status == "pending" or .status == "waiting")) | .databaseId' \
            | while read -r run_id; do
                test -n "$run_id" && gh run cancel "$run_id" --repo "$REPO" || true
              done
      - name: Preflight existing PR and release
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: MOVEI144/RunnerLoom
          TAG: v0.1.0-rc.4
        run: |
          set -euo pipefail
          merged="$(gh pr view 14 --repo "$REPO" --json mergedAt --jq '.mergedAt != null')"
          merge_sha="$(gh pr view 14 --repo "$REPO" --json mergeCommit --jq '.mergeCommit.oid // empty')"
          released=false
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            released=true
            test "$merged" = true
            test -n "$merge_sha"
            target="$(gh release view "$TAG" --repo "$REPO" --json targetCommitish --jq .targetCommitish)"
            test "$target" = "$merge_sha"
            verify="$RUNNER_TEMP/existing-release"
            mkdir -p "$verify"
            gh release download "$TAG" --repo "$REPO" --dir "$verify"
            (cd "$verify" && sha256sum --check SHA256SUMS)
            jq -e --arg sha "$merge_sha" '.sourceCommit == $sha' "$verify/runnerloom-0.1.0-rc.4-buildinfo.json"
          fi
          echo "merged=$merged" >> "$GITHUB_OUTPUT"
          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"
          echo "released=$released" >> "$GITHUB_OUTPUT"
      - name: Wait for non-internal branch checks
        if: steps.preflight.outputs.released != 'true' && steps.preflight.outputs.merged != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: MOVEI144/RunnerLoom
          BRANCH: feat/interactive-cli-rc4
        run: |
          set -euo pipefail
          for _ in $(seq 1 180); do
            active="$(gh run list --repo "$REPO" --branch "$BRANCH" --limit 100 --json databaseId,name,status \
              | jq --argjson self "$GITHUB_RUN_ID" '[.[] | select(.databaseId != $self and (.name | startswith("Internal ") | not) and (.status == "queued" or .status == "in_progress" or .status == "pending" or .status == "requested" or .status == "waiting"))] | length')"
            test "$active" -eq 0 && exit 0
            sleep 10
          done
          echo 'Branch checks did not become idle' >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.preflight.outputs.released != 'true' && steps.preflight.outputs.merged != 'true'
        with:
          ref: feat/interactive-cli-rc4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.preflight.outputs.released != 'true'
        with:
          go-version: '1.27.1'
          cache: true
      - name: Normalize and complete the interactive candidate
        if: steps.preflight.outputs.released != 'true' && steps.preflight.outputs.merged != 'true'
        run: |
          set -euo pipefail
          git fetch origin feat/interactive-cli-rc4
          git reset --hard origin/feat/interactive-cli-rc4
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          cli = root / 'internal/cli/cli.go'
          interactive = root / 'internal/cli/interactive.go'
          tests = root / 'internal/cli/interactive_test.go'
          setup = root / 'internal/cli/setup.go'
          guide = root / 'docs/INTERACTIVE_CLI.ja.md'

          for path in (cli, interactive, tests, setup, guide):
              if not path.is_file():
                  raise SystemExit(f'missing required interactive file: {path}')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count == 0 and new in text:
                  return text
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          text = cli.read_text(encoding='utf-8')
          old_root = '\troot.RunE = func(c *cobra.Command, _ []string) error { return c.Help() }\n'
          new_root = ('\ta.addInteractive(root)\n'
                      '\troot.RunE = func(c *cobra.Command, _ []string) error {\n'
                      '\t\tif a.shouldStartInteractive() {\n'
                      '\t\t\treturn a.runInteractive(c.Context())\n'
                      '\t\t}\n'
                      '\t\treturn c.Help()\n'
                      '\t}\n')
          if 'a.addInteractive(root)' not in text:
              text = replace_once(text, old_root, new_root, 'root integration')
          cli.write_text(text, encoding='utf-8')

          text = interactive.read_text(encoding='utf-8')
          if '\t"unicode"\n' not in text:
              text = replace_once(text, '\t"time"\n', '\t"time"\n\t"unicode"\n', 'unicode import')

          old_dispatch = ('\tif !containsStateFlag(args) {\n'
                          '\t\tfull = append(full, "--state", a.State)\n'
                          '\t}\n'
                          '\tfull = append(full, args...)\n')
          new_dispatch = ('\tif !containsStateFlag(args) {\n'
                          '\t\tfull = append(full, "--state", a.State)\n'
                          '\t}\n'
                          '\tif !allowPrompts {\n'
                          '\t\tfull = append(full, "--non-interactive")\n'
                          '\t}\n'
                          '\tfull = append(full, args...)\n')
          if old_dispatch in text:
              text = text.replace(old_dispatch, new_dispatch, 1)
          if new_dispatch not in text:
              raise SystemExit('nested commands are not explicitly non-interactive')

          replacements = {
              'fmt.Fprintf(a.Err, "%s: ", label)': 'fmt.Fprintf(a.Err, "%s: ", interactiveSafe(label))',
              'fmt.Fprintf(a.Err, "%s [%s]: ", label, interactiveSafe(fallback))': 'fmt.Fprintf(a.Err, "%s [%s]: ", interactiveSafe(label), interactiveSafe(fallback))',
              'fmt.Fprintf(a.Err, "\\n%s\\n", title)': 'fmt.Fprintf(a.Err, "\\n%s\\n", interactiveSafe(title))',
              'fmt.Fprintf(a.Err, "  %s. %s\\n", item.Key, item.Label)': 'fmt.Fprintf(a.Err, "  %s. %s\\n", interactiveSafe(item.Key), interactiveSafe(item.Label))',
              'fmt.Fprintf(a.Err, "\\n%s\\n", summary)': 'fmt.Fprintf(a.Err, "\\n%s\\n", interactiveSafe(summary))',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          old_path = 'if filepath.IsAbs(value) && filepath.Clean(value) == value && value != "/" {'
          new_path = 'if filepath.IsAbs(value) && filepath.Clean(value) == value && value != "/" && strings.IndexFunc(value, unicode.IsControl) == -1 {'
          if old_path in text:
              text = text.replace(old_path, new_path, 1)
          if new_path not in text:
              raise SystemExit('absolute path control-character validation missing')

          duration_marker = 'func (a *App) interactiveDuration(label string, fallback time.Duration, minimum, maximum time.Duration) (time.Duration, error) {\n'
          id_helper = '''func (a *App) interactiveID(label string) (string, error) {\n\tfor {\n\t\tvalue, err := a.interactiveRequired(label, "")\n\t\tif err != nil {\n\t\t\treturn "", err\n\t\t}\n\t\tif core.ValidID(value) {\n\t\t\treturn value, nil\n\t\t}\n\t\t_, _ = fmt.Fprintln(a.Err, "32桁の小文字16進数IDを入力してください。")\n\t}\n}\n\n'''
          if 'func (a *App) interactiveID(' not in text:
              text = replace_once(text, duration_marker, id_helper + duration_marker, 'interactive ID helper')
          text = text.replace('id, promptErr := a.interactiveRequired("承認する申請ID", "")', 'id, promptErr := a.interactiveID("承認する申請ID")', 1)

          int_helper = '''func (a *App) interactiveInt64(label string, fallback, minimum, maximum int64) (int64, error) {\n\tfor {\n\t\tvalue, err := a.interactiveRequired(label, strconv.FormatInt(fallback, 10))\n\t\tif err != nil {\n\t\t\treturn 0, err\n\t\t}\n\t\tnumber, err := strconv.ParseInt(value, 10, 64)\n\t\tif err == nil && number >= minimum && number <= maximum {\n\t\t\treturn number, nil\n\t\t}\n\t\t_, _ = fmt.Fprintf(a.Err, "%d〜%dの整数を入力してください。\\n", minimum, maximum)\n\t}\n}\n\n'''
          if 'func (a *App) interactiveInt64(' not in text:
              text = replace_once(text, duration_marker, int_helper + duration_marker, 'interactive integer helper')

          old_limit = '''\t\tvalue, err := a.interactiveRequired("Controller cache上限 GiB", "100")\n\t\tif err != nil {\n\t\t\treturn nil, false, err\n\t\t}\n\t\tlimit, err := strconv.ParseInt(value, 10, 64)\n\t\tif err != nil || limit < 1 {\n\t\t\treturn nil, false, errors.New("cache上限は1以上の整数GiBで指定してください")\n\t\t}\n'''
          new_limit = '''\t\tlimit, err := a.interactiveInt64("Controller cache上限 GiB", 100, 1, 1048576)\n\t\tif err != nil {\n\t\t\treturn nil, false, err\n\t\t}\n'''
          if old_limit in text:
              text = text.replace(old_limit, new_limit, 1)
          if new_limit not in text:
              raise SystemExit('cache integer prompt missing')

          old_cache_menu = '''\t\t\t{"5", "同一HostのControllerからNodeへseed"},\n\t\t\t{"0", "戻る"},\n'''
          new_cache_menu = '''\t\t\t{"5", "同一HostのControllerからNodeへseed"},\n\t\t\t{"6", "Golden Imageをbuild"},\n\t\t\t{"7", "qcow2をController cacheへimport"},\n\t\t\t{"0", "戻る"},\n'''
          if old_cache_menu in text:
              text = text.replace(old_cache_menu, new_cache_menu, 1)
          if new_cache_menu not in text:
              raise SystemExit('image build/import menu entries missing')

          cache_insert_marker = '''\t\tif choice == "5" {\n'''
          cache_extra = '''\t\tif choice == "6" {\n\t\t\tout, promptErr := a.interactiveAbsolutePath("Golden Image出力先", "/var/lib/runnerloom/builds/ubuntu-runner.qcow2")\n\t\t\tif promptErr != nil {\n\t\t\t\treturn promptErr\n\t\t\t}\n\t\t\tok, promptErr := a.interactiveConfirm("Canonical署名と公式Runnerのdigestを検証して未登録qcow2をbuildします。既存出力は上書きしません。", "BUILD")\n\t\t\tif promptErr != nil {\n\t\t\t\treturn promptErr\n\t\t\t}\n\t\t\tif ok {\n\t\t\t\ta.interactiveRun(ctx, []string{"image", "build", "--out", out}, false)\n\t\t\t}\n\t\t\tcontinue\n\t\t}\n\t\tif choice == "7" {\n\t\t\tfile, promptErr := a.interactiveAbsolutePath("importする独立qcow2", "/var/lib/runnerloom/builds/ubuntu-runner.qcow2")\n\t\t\tif promptErr != nil {\n\t\t\t\treturn promptErr\n\t\t\t}\n\t\t\tdigest, promptErr := a.interactiveDigest("期待するImage digest")\n\t\t\tif promptErr != nil {\n\t\t\t\treturn promptErr\n\t\t\t}\n\t\t\tlimit, promptErr := a.interactiveInt64("Controller cache上限 GiB", 100, 1, 1048576)\n\t\t\tif promptErr != nil {\n\t\t\t\treturn promptErr\n\t\t\t}\n\t\t\tok, promptErr := a.interactiveConfirm("Image全体のSHA-256とqcow2構造を検証してController cacheへatomicに登録します。", "IMPORT")\n\t\t\tif promptErr != nil {\n\t\t\t\treturn promptErr\n\t\t\t}\n\t\t\tif ok {\n\t\t\t\ta.interactiveRun(ctx, []string{"image", "import", "--file", file, "--digest", digest, "--cache-gib", strconv.FormatInt(limit, 10)}, false)\n\t\t\t}\n\t\t\tcontinue\n\t\t}\n'''
          if 'Golden Image出力先' not in text:
              text = replace_once(text, cache_insert_marker, cache_extra + cache_insert_marker, 'image menu handlers')

          old_pool_menu = '''\t\t\t{"3", "GitHub App・Runner Group・Repository権限を検査"},\n\t\t\t{"0", "戻る"},\n'''
          new_pool_menu = '''\t\t\t{"3", "GitHub App・Runner Group・Repository権限を検査"},\n\t\t\t{"4", "Cluster設定JSONを検証"},\n\t\t\t{"5", "Cluster設定をplanして適用"},\n\t\t\t{"0", "戻る"},\n'''
          if old_pool_menu in text:
              text = text.replace(old_pool_menu, new_pool_menu, 1)
          if new_pool_menu not in text:
              raise SystemExit('config menu entries missing')

          old_pool_case = '''\t\tcase "3":\n\t\t\ta.interactiveRun(ctx, []string{"github", "check"}, false)\n\t\t}\n'''
          new_pool_case = '''\t\tcase "3":\n\t\t\ta.interactiveRun(ctx, []string{"github", "check"}, false)\n\t\tcase "4", "5":\n\t\t\tcwd, _ := os.Getwd()\n\t\t\tconfigPath, promptErr := a.interactiveAbsolutePath("Cluster設定JSON", filepath.Join(cwd, "cluster.json"))\n\t\t\tif promptErr != nil {\n\t\t\t\treturn promptErr\n\t\t\t}\n\t\t\tif choice == "4" {\n\t\t\t\ta.interactiveRun(ctx, []string{"config", "validate", "--file", configPath}, false)\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\tif !a.interactiveRun(ctx, []string{"config", "plan", "--file", configPath}, false) {\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\tplanID, promptErr := a.interactiveID("上に表示されたplan ID")\n\t\t\tif promptErr != nil {\n\t\t\t\treturn promptErr\n\t\t\t}\n\t\t\tok, promptErr := a.interactiveConfirm("planは10分で失効し、競合時は拒否されます。ホストnetworkやserviceは変更しません。", "APPLY "+planID)\n\t\t\tif promptErr != nil {\n\t\t\t\treturn promptErr\n\t\t\t}\n\t\t\tif ok {\n\t\t\t\ta.interactiveRun(ctx, []string{"config", "apply", "--plan", planID}, false)\n\t\t\t}\n\t\t}\n'''
          if old_pool_case in text:
              text = text.replace(old_pool_case, new_pool_case, 1)
          if new_pool_case not in text:
              raise SystemExit('config menu handlers missing')

          for marker in (
              'interactiveSafe(label)',
              'interactiveSafe(summary)',
              'func (a *App) interactiveID(',
              'a.interactiveID("承認する申請ID")',
              'func (a *App) interactiveInt64(',
              'Golden Image出力先',
              'Cluster設定をplanして適用',
          ):
              if marker not in text:
                  raise SystemExit(f'missing interactive marker: {marker}')
          interactive.write_text(text, encoding='utf-8')

          text = tests.read_text(encoding='utf-8')
          if '"errors"' not in text:
              text = text.replace('\t"context"\n', '\t"context"\n\t"errors"\n', 1)
          text = text.replace('if err == nil || err.Error() != "boom" {', 'if !errors.Is(err, io.ErrUnexpectedEOF) {', 1)
          if '!errors.Is(err, io.ErrUnexpectedEOF)' not in text:
              raise SystemExit('reader failure assertion is incorrect')
          tests.write_text(text, encoding='utf-8')

          text = setup.read_text(encoding='utf-8')
          text = text.replace('fmt.Fprintf(a.Err, "%s [%s]: ", label, fallback)', 'fmt.Fprintf(a.Err, "%s [%s]: ", interactiveSafe(label), interactiveSafe(fallback))', 1)
          if 'interactiveSafe(label), interactiveSafe(fallback)' not in text:
              raise SystemExit('legacy setup prompt output is not sanitized')
          setup.write_text(text, encoding='utf-8')

          quality_test = root / 'internal/cli/interactive_quality_test.go'
          quality_test.write_text(r'''package cli

import (
	"bytes"
	"strings"
	"testing"
)

func TestInteractiveAbsolutePathRejectsControls(t *testing.T) {
	var out, errOut bytes.Buffer
	a := &App{In: strings.NewReader("/tmp/bad\x1b[2J\n/tmp/good path\n"), Out: &out, Err: &errOut}
	got, err := a.interactiveAbsolutePath("path", "")
	if err != nil {
		t.Fatal(err)
	}
	if got != "/tmp/good path" {
		t.Fatalf("got %q", got)
	}
}

func TestInteractiveInt64Reprompts(t *testing.T) {
	var out, errOut bytes.Buffer
	a := &App{In: strings.NewReader("invalid\n0\n128\n"), Out: &out, Err: &errOut}
	got, err := a.interactiveInt64("cache", 100, 1, 1024)
	if err != nil {
		t.Fatal(err)
	}
	if got != 128 {
		t.Fatalf("got %d", got)
	}
}
''', encoding='utf-8')

          def insert_before_first_h2(path: Path, section: str) -> None:
              content = path.read_text(encoding='utf-8')
              heading = section.strip().splitlines()[0]
              if heading in content:
                  return
              marker = '\n## '
              index = content.find(marker)
              if index < 0:
                  content = content.rstrip() + '\n\n' + section.strip() + '\n'
              else:
                  content = content[:index + 1] + section.strip() + '\n\n' + content[index + 1:]
              path.write_text(content, encoding='utf-8')

          def append_if_missing(path: Path, heading: str, body: str) -> None:
              content = path.read_text(encoding='utf-8')
              if heading in content:
                  return
              path.write_text(content.rstrip() + '\n\n' + heading + '\n\n' + body.strip() + '\n', encoding='utf-8')

          insert_before_first_h2(root / 'README.md', '''
## 対話CLI

端末で引数なしの`runnerloom`を実行すると、人向けの対話メニューを開きます。既存のサブコマンドを内部で再利用するため、通常CLIと処理・安全条件は共通です。

```bash
runnerloom
# または
runnerloom interactive
```

パイプ、リダイレクト、CI、`--json`、`--non-interactive`、明示したサブコマンドでは入力待ちせず、従来の非対話動作を維持します。詳しくは[対話CLIガイド](docs/INTERACTIVE_CLI.ja.md)を参照してください。
''')
          append_if_missing(root / 'docs/README.md', '## 対話メニューから操作する', '- [対話CLI](INTERACTIVE_CLI.ja.md) — TTY自動判定、メニュー、非対話互換性、確認語、安全境界')
          append_if_missing(root / 'docs/OPERATIONS.ja.md', '## 対話メニューから運用する', '`runnerloom`または`runnerloom interactive`から状態、Cache、network、Node、Pool/GitHub、backup、maintenance、serviceを選べます。自動化では従来のサブコマンドと`--non-interactive`を使用してください。')
          cache_doc = root / 'docs/CACHE.ja.md'
          if cache_doc.is_file():
              append_if_missing(cache_doc, '## 対話メニューからCacheを操作する', 'Image cacheメニューからstatus、完全検証、prune dry-run/apply、same-host seed、Golden Image build、Controller importを実行できます。`prune --apply`は先にdry-runを表示し、完全一致の確認語を要求します。')
          append_if_missing(root / 'SECURITY.md', '## Interactive CLI boundary', 'Interactive mode requires terminal-connected stdin, stdout, and stderr. JSON, non-interactive, piped, redirected, service, and explicit-command invocations do not prompt. Values are passed as argument slices to existing commands, dynamic terminal text is sanitized, and destructive operations retain exact confirmations and existing fail-closed checks.')

          quick = root / 'docs/QUICKSTART.ja.md'
          quick_text = quick.read_text(encoding='utf-8')
          if 'INTERACTIVE_CLI.ja.md' not in quick_text:
              marker = '## このガイドの完了条件'
              note = '> [!TIP]\n> 端末で`runnerloom`だけを実行すると対話メニューを利用できます。詳細は[対話CLI](INTERACTIVE_CLI.ja.md)を参照してください。このQuick Startの完了条件自体は省略されません。\n\n'
              if marker not in quick_text:
                  raise SystemExit('quickstart insertion marker missing')
              quick.write_text(quick_text.replace(marker, note + marker, 1), encoding='utf-8')

          checker = root / 'scripts/check-docs.py'
          checker_text = checker.read_text(encoding='utf-8')
          entry = '    ROOT / "docs" / "INTERACTIVE_CLI.ja.md",\n'
          if entry not in checker_text:
              candidates = ['    ROOT / "docs" / "CACHE.ja.md",\n', '    ROOT / "docs" / "TROUBLESHOOTING.ja.md",\n', '    ROOT / "docs" / "OPERATIONS.ja.md",\n']
              for marker in candidates:
                  if marker in checker_text:
                      checker_text = checker_text.replace(marker, marker + entry, 1)
                      break
              else:
                  raise SystemExit('docs checker insertion marker missing')
              checker.write_text(checker_text, encoding='utf-8')

          version = root / 'VERSION'
          version.write_text('0.1.0-rc.4\n', encoding='utf-8')
          changelog = root / 'CHANGELOG.md'
          change_text = changelog.read_text(encoding='utf-8')
          if '## 0.1.0-rc.4' not in change_text:
              entry_text = '''## 0.1.0-rc.4

- Added a guarded interactive operator menu for setup, diagnostics, Golden Images, image cache, VM network, Node, configuration, Pool/GitHub, backup/maintenance, and systemd service workflows.
- Preserved explicit subcommands and machine-readable behavior; non-TTY, `--json`, and `--non-interactive` invocations never wait for menu input.
- Added exact confirmation phrases, dry-run-first destructive paths, terminal sanitization, bounded input, argument-array dispatch, and regression coverage.

'''
              index = change_text.find('\n## ')
              change_text = change_text.rstrip() + '\n\n' + entry_text if index < 0 else change_text[:index + 1] + entry_text + change_text[index + 1:]
              changelog.write_text(change_text, encoding='utf-8')

          temporary = [
              '.github/workflows/internal-source-export.yml',
              '.github/workflows/internal-apply-interactive-rc4.yml',
              '.github/workflows/internal-finalize-interactive-rc4.yml',
              '.github/workflows/internal-finalize-interactive-rc4-v2.yml',
              '.github/workflows/internal-fix-interactive-dispatch.yml',
              '.github/workflows/internal-harden-interactive-input.yml',
              '.github/workflows/internal-harden-setup-prompt.yml',
              '.github/workflows/internal-ensure-setup-prompt.yml',
              '.github/workflows/internal-unblock-interactive-rc4.yml',
              '.github/workflows/internal-unified-interactive-fix.yml',
              '.github/workflows/internal-release-interactive-rc4.yml',
              '.github/workflows/internal-release-interactive-rc4-v2.yml',
              '.github/workflows/internal-release-interactive-rc4-v3.yml',
              'scripts/apply-interactive-rc4.py',
          ]
          for name in temporary:
              (root / name).unlink(missing_ok=True)
          PY
          gofmt -w internal/cli/cli.go internal/cli/setup.go internal/cli/interactive*.go internal/cli/setup_prompt_security_gate_test.go
          go mod tidy
      - name: Test and package the clean candidate
        if: steps.preflight.outputs.released != 'true' && steps.preflight.outputs.merged != 'true'
        run: |
          set -euo pipefail
          python3 scripts/check-docs.py
          git diff --check
          grep -F 'a.addInteractive(root)' internal/cli/cli.go
          grep -F 'full = append(full, "--non-interactive")' internal/cli/interactive.go
          grep -F 'Golden Image出力先' internal/cli/interactive.go
          grep -F 'Cluster設定をplanして適用' internal/cli/interactive.go
          grep -F 'interactiveSafe(label), interactiveSafe(fallback)' internal/cli/setup.go
          grep -Fx '0.1.0-rc.4' VERSION
          ! find .github/workflows scripts -type f \( -name 'internal-*interactive*' -o -name 'apply-interactive-rc4.py' \) -print -quit | grep .
          go vet ./...
          go test -race -count=1 ./...
          go mod vendor
          python3 scripts/package.py --deb
          python3 scripts/test_package.py dist
          (cd dist && sha256sum --check SHA256SUMS)
          git diff --exit-code -- go.mod go.sum
      - name: Smoke-test packaged TTY and non-TTY behavior
        if: steps.preflight.outputs.released != 'true' && steps.preflight.outputs.merged != 'true'
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/interactive-package"
          mkdir -p "$stage"
          tar -xzf dist/runnerloom-0.1.0-rc.4-linux-amd64.tar.gz -C "$stage"
          binary="$(find "$stage" -type f -name runnerloom -perm -111 -print -quit)"
          test -n "$binary"
          printf '0\n' | script -qefc "$binary" "$RUNNER_TEMP/interactive-tty.log"
          grep -F 'RunnerLoom 0.1.0-rc.4 対話モード' "$RUNNER_TEMP/interactive-tty.log"
          printf '0\n' | "$binary" > "$RUNNER_TEMP/non-tty.out" 2> "$RUNNER_TEMP/non-tty.err"
          ! grep -F 'メインメニュー' "$RUNNER_TEMP/non-tty.out" "$RUNNER_TEMP/non-tty.err"
          grep -F 'Usage:' "$RUNNER_TEMP/non-tty.out" "$RUNNER_TEMP/non-tty.err"
          "$binary" --json > "$RUNNER_TEMP/help.json"
          jq -e '.ok == true and (.data.commands | length > 0)' "$RUNNER_TEMP/help.json"
      - name: Push the exact clean candidate
        if: steps.preflight.outputs.released != 'true' && steps.preflight.outputs.merged != 'true'
        id: candidate
        run: |
          set -euo pipefail
          rm -rf vendor dist
          git config user.name runnerloom-interactive-bot
          git config user.email '184829077+Aero123421@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if test -n "$(git status --porcelain)"; then
            git commit -m 'feat(cli): ship guarded interactive operator mode'
            git push origin HEAD:feat/interactive-cli-rc4
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Run full CI on the exact candidate
        if: steps.preflight.outputs.released != 'true' && steps.preflight.outputs.merged != 'true'
        id: candidate_ci
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: MOVEI144/RunnerLoom
          BRANCH: feat/interactive-cli-rc4
          HEAD_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          gh workflow run ci.yml --repo "$REPO" --ref "$BRANCH"
          run_id=""
          for _ in $(seq 1 60); do
            runs="$(gh run list --repo "$REPO" --workflow ci.yml --branch "$BRANCH" --event workflow_dispatch --limit 50 --json databaseId,headSha,createdAt)"
            run_id="$(printf '%s' "$runs" | jq -r --arg sha "$HEAD_SHA" 'map(select(.headSha == $sha)) | sort_by(.createdAt) | last | .databaseId // empty')"
            test -n "$run_id" && break
            sleep 5
          done
          test -n "$run_id"
          gh run watch "$run_id" --repo "$REPO" --exit-status
          echo "url=$(gh run view "$run_id" --repo "$REPO" --json url --jq .url)" >> "$GITHUB_OUTPUT"
      - name: Require final CodeRabbit review and no open threads
        if: steps.preflight.outputs.released != 'true' && steps.preflight.outputs.merged != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: MOVEI144/RunnerLoom
          HEAD_SHA: ${{ steps.candidate.outputs.sha }}
          CI_URL: ${{ steps.candidate_ci.outputs.url }}
        run: |
          set -euo pipefail
          printf '@coderabbitai review\n\nFinal candidate is `%s`. Review TTY gating, JSON/non-interactive compatibility, nested Cobra dispatch, confirmation boundaries, terminal sanitization, path handling, and secret exposure. Full CI: %s\n' "$HEAD_SHA" "$CI_URL" > "$RUNNER_TEMP/review-request.md"
          gh pr comment 14 --repo "$REPO" --body-file "$RUNNER_TEMP/review-request.md"
          reviewed=0
          for attempt in $(seq 1 120); do
            reviewed="$(gh api --paginate "repos/$REPO/pulls/14/reviews" | jq -s --arg sha "$HEAD_SHA" '[add[] | select((.user.login == "coderabbitai[bot]" or .user.login == "coderabbitai") and .commit_id == $sha)] | length')"
            test "$reviewed" -gt 0 && break
            if test "$attempt" -eq 60; then
              gh pr comment 14 --repo "$REPO" --body '@coderabbitai review'
            fi
            sleep 10
          done
          test "$reviewed" -gt 0
          unresolved="$(gh api graphql -f owner=MOVEI144 -f name=RunnerLoom -F number=14 -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}' --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length')"
          if test "$unresolved" -ne 0; then
            gh pr comment 14 --repo "$REPO" --body "Release gate stopped: CodeRabbit left $unresolved unresolved review thread(s). No merge or release was performed."
            exit 1
          fi
      - name: Merge PR 14
        if: steps.preflight.outputs.released != 'true' && steps.preflight.outputs.merged != 'true'
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: MOVEI144/RunnerLoom
        run: |
          set -euo pipefail
          gh pr merge 14 --repo "$REPO" --merge --delete-branch=false
          merge_sha="$(gh pr view 14 --repo "$REPO" --json mergedAt,mergeCommit --jq 'select(.mergedAt != null) | .mergeCommit.oid')"
          test -n "$merge_sha"
          echo "sha=$merge_sha" >> "$GITHUB_OUTPUT"
      - name: Resolve merge commit
        if: steps.preflight.outputs.released != 'true'
        id: resolved
        env:
          EXISTING_SHA: ${{ steps.preflight.outputs.merge_sha }}
          NEW_SHA: ${{ steps.merge.outputs.sha }}
        run: |
          set -euo pipefail
          sha="${NEW_SHA:-${EXISTING_SHA:-}}"
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Run full CI on the exact main commit
        if: steps.preflight.outputs.released != 'true'
        id: main_ci
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: MOVEI144/RunnerLoom
          MERGE_SHA: ${{ steps.resolved.outputs.sha }}
        run: |
          set -euo pipefail
          gh workflow run ci.yml --repo "$REPO" --ref main
          run_id=""
          for _ in $(seq 1 60); do
            runs="$(gh run list --repo "$REPO" --workflow ci.yml --branch main --event workflow_dispatch --limit 50 --json databaseId,headSha,createdAt)"
            run_id="$(printf '%s' "$runs" | jq -r --arg sha "$MERGE_SHA" 'map(select(.headSha == $sha)) | sort_by(.createdAt) | last | .databaseId // empty')"
            test -n "$run_id" && break
            sleep 5
          done
          test -n "$run_id"
          gh run watch "$run_id" --repo "$REPO" --exit-status
          echo "url=$(gh run view "$run_id" --repo "$REPO" --json url --jq .url)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.preflight.outputs.released != 'true'
        with:
          ref: ${{ steps.resolved.outputs.sha }}
      - name: Build release assets from the exact merge
        if: steps.preflight.outputs.released != 'true'
        env:
          MERGE_SHA: ${{ steps.resolved.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          grep -Fx '0.1.0-rc.4' VERSION
          go mod vendor
          rm -rf dist
          python3 scripts/package.py --deb
          python3 scripts/test_package.py dist
          (cd dist && sha256sum --check SHA256SUMS)
          jq -e --arg sha "$MERGE_SHA" '.sourceCommit == $sha' dist/runnerloom-0.1.0-rc.4-buildinfo.json
      - name: Publish and independently verify v0.1.0-rc.4
        if: steps.preflight.outputs.released != 'true'
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: MOVEI144/RunnerLoom
          TAG: v0.1.0-rc.4
          MERGE_SHA: ${{ steps.resolved.outputs.sha }}
          QUALIFICATION_URL: ${{ steps.main_ci.outputs.url }}
        run: |
          set -euo pipefail
          ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          ## RunnerLoom 0.1.0-rc.4

          Adds a guarded human-oriented interactive CLI while preserving the existing automation interface.

          - Run \`runnerloom\` in a terminal or \`runnerloom interactive\` to open the numbered menu.
          - Covers setup, diagnostics, Golden Image build/import, image cache, VM network, Node, configuration, Pool/GitHub, backup/maintenance and systemd service workflows.
          - Non-TTY, explicit subcommands, \`--json\` and \`--non-interactive\` never wait for menu input.
          - Host-changing operations require exact confirmation phrases; cache prune and database compact remain dry-run-first.
          - Values are passed as argument arrays to existing fail-closed Cobra commands, not through a shell.
          - Dynamic terminal output is sanitized and operator input is bounded and validated.

          Source: \`$MERGE_SHA\`
          Qualification: $QUALIFICATION_URL
          EOF
          gh release create "$TAG" dist/* --repo "$REPO" --target "$MERGE_SHA" --title 'RunnerLoom 0.1.0-rc.4' --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease
          verify="$RUNNER_TEMP/release-verify"
          mkdir -p "$verify"
          gh release download "$TAG" --repo "$REPO" --dir "$verify"
          (cd "$verify" && sha256sum --check SHA256SUMS)
          jq -e --arg sha "$MERGE_SHA" '.sourceCommit == $sha' "$verify/runnerloom-0.1.0-rc.4-buildinfo.json"
          target="$(gh release view "$TAG" --repo "$REPO" --json targetCommitish --jq .targetCommitish)"
          test "$target" = "$MERGE_SHA"
          echo "url=$(gh release view "$TAG" --repo "$REPO" --json url --jq .url)" >> "$GITHUB_OUTPUT"
      - name: Record completion
        if: steps.preflight.outputs.released != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: MOVEI144/RunnerLoom
        run: |
          gh pr comment 14 --repo "$REPO" --body "Merged and released as [v0.1.0-rc.4](${{ steps.publish.outputs.url }}). Merge commit: \`${{ steps.resolved.outputs.sha }}\`. Main qualification: ${{ steps.main_ci.outputs.url }}. Published assets were downloaded again and verified against SHA256SUMS and buildinfo.sourceCommit."
      - name: Existing release verified
        if: steps.preflight.outputs.released == 'true'
        run: echo 'v0.1.0-rc.4 already existed and passed target/checksum/buildinfo verification.'
