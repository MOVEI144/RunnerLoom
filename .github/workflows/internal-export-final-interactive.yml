name: Internal export final interactive branch

on:
  push:
    branches: [feat/interactive-cli-rc4]
    paths:
      - .github/workflows/internal-export-final-interactive.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true
      - name: Verify branch before export
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "0.1.0-rc.4"
          test -f internal/cli/interactive.go
          test -f internal/cli/interactive_test.go
          test -f docs/INTERACTIVE_CLI.ja.md
          test ! -f .github/workflows/internal-apply-interactive-cli.yml
          test ! -f .github/workflows/internal-finish-interactive-cli.yml
          test -z "$(gofmt -l cmd internal)"
          python3 scripts/check-docs.py
          go vet ./...
          go test -count=1 ./...
          go test -race -count=1 ./internal/cli
          go mod vendor
          python3.12 scripts/package.py --deb
          python3.12 scripts/test_package.py dist
      - name: Package source and validation evidence
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/export"
          tar --exclude=.git --exclude=vendor --exclude=dist -czf "$RUNNER_TEMP/export/runnerloom-interactive-rc4-source.tar.gz" .
          cp VERSION "$RUNNER_TEMP/export/"
          git rev-parse HEAD > "$RUNNER_TEMP/export/COMMIT"
          sha256sum "$RUNNER_TEMP/export/runnerloom-interactive-rc4-source.tar.gz" > "$RUNNER_TEMP/export/SHA256SUMS"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: interactive-final-${{ github.sha }}
          path: ${{ runner.temp }}/export/
          retention-days: 1
          if-no-files-found: error
      - name: Remove this temporary workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/internal-export-final-interactive.yml
          git config user.name runnerloom-interactive-bot
          git config user.email '184829077+Aero123421@users.noreply.github.com'
          git commit -m 'chore: remove temporary interactive verification workflow'
          git push origin HEAD:feat/interactive-cli-rc4
