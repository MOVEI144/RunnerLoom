	}
	if len(response.Images) != 1 || response.Images[0].Digest != config.Images[0].Digest {
		t.Fatalf("unexpected enabled image catalog: %+v", response.Images)
	}
}

func TestNodeCatalogRetainsActiveInstanceFromDisabledPool(t *testing.T) {
	store, err := OpenStore(t.TempDir())
	if err != nil {
		t.Fatal(err)
	}
	defer store.Close()
	config := Example()
	heavyDigest := "sha256:" + strings.Repeat("c", 64)
	config.Images = append(config.Images, Image{Name: "heavy-image", Digest: heavyDigest, MinimumRootGiB: 20})
	config.Pools[1].Image = "heavy-image"
	config.Reservations = []Reservation{}
	applyCacheCatalogConfig(t, store, config)
	if _, err = store.Sync(context.Background(), "node-a", cacheCatalogObservation(config, 1, []string{config.Images[0].Digest, heavyDigest})); err != nil {
		t.Fatal(err)
	}
	if _, err = store.Allocate(context.Background(), "heavy-request", config.Pools[1].Name); err != nil {
		t.Fatal(err)
	}
	config.Pools[1].Enabled = false
	applyCacheCatalogConfig(t, store, config)
	response, err := store.Sync(context.Background(), "node-a", cacheCatalogObservation(config, 2, []string{config.Images[0].Digest, heavyDigest}))
	if err != nil {
		t.Fatal(err)
	}
	found := false
	for _, image := range response.Images {
		if image.Digest == heavyDigest {
			found = true
		}
	}
	if !found {
		t.Fatalf("active Instance image disappeared with its disabled Pool: %+v", response.Images)
	}
}
