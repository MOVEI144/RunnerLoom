name: Internal definitive cache lifecycle validation

on:
  push:
    branches:
      - feat/cache-lifecycle-management
    paths:
      - .github/workflows/internal-cache-definitive.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Write idempotent finalizer
        shell: bash
        run: |
          cat > /tmp/finalize-cache.py <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if text.count(old) != 1:
                  raise SystemExit(f"marker mismatch in {path}: {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          # Essential integration is repeated idempotently so this finalizer is
          # valid even when an older internal workflow lost a concurrent push.
          replace_once(
              "internal/host/images.go",
              "type Images struct {\n\tDir      string\n\tLimitGiB int64\n\tExec     Executor",
              "type Images struct {\n\tDir        string\n\tLimitGiB   int64\n\tReserveGiB int64\n\tExec       Executor",
          )
          replace_once(
              "internal/host/images.go",
              "\tif i.LimitGiB < 1 || i.LimitGiB > 1048576 {\n\t\treturn \"\", errors.New(\"invalid image cache limit\")\n\t}",
              "\tif e = validateCachePolicy(i.effectiveCacheLimitGiB(), i.effectiveCacheReserveGiB()); e != nil {\n\t\treturn \"\", e\n\t}",
          )
          replace_once(
              "internal/host/images.go",
              "\tavailable := i.LimitGiB*(1<<30) - used\n\tif available <= 0 {\n\t\treturn \"\", errors.New(\"image cache capacity exhausted\")\n\t}",
              "\tavailable, e := i.importBudgetBytes(used)\n\tif e != nil {\n\t\treturn \"\", e\n\t}",
          )
          replace_once(
              "internal/cli/cli.go",
              "\ta.addMaintenance(root)\n\ta.addSetup(root)",
              "\ta.addMaintenance(root)\n\ta.addCache(root)\n\ta.addSetup(root)",
          )

          test_file = Path("internal/host/cache_test.go")
          test_text = test_file.read_text()
          if '"encoding/json"' not in test_text:
              test_file.write_text(test_text.replace('"context"\n', '"context"\n\t"encoding/json"\n', 1))

          cli = Path("internal/cli/cache.go")
          cli_text = cli.read_text()
          old_refs = '''\trequired := map[string][]string{}\n\tfor _, image := range config.Images {\n\t\trequired[image.Digest] = append(required[image.Digest], "config:"+image.Name)\n\t}\n'''
          new_refs = '''\trequired := map[string][]string{}\n\tfor _, pool := range config.Pools {\n\t\tif !pool.Enabled {\n\t\t\tcontinue\n\t\t}\n\t\timage, ok := config.Image(pool.Image)\n\t\tif ok {\n\t\t\trequired[image.Digest] = append(required[image.Digest], "pool:"+pool.Name)\n\t\t}\n\t}\n'''
          if new_refs not in cli_text:
              if old_refs not in cli_text:
                  raise SystemExit("controller cache reference block missing")
              cli.write_text(cli_text.replace(old_refs, new_refs, 1))

          store = Path("internal/core/store.go")
          store_text = store.read_text()
          old_catalog = '''\t\tfor _, p := range c.Pools {\n\t\t\tif c.Eligible(p, n) {\n\t\t\t\tim, _ := c.Image(p.Image)\n'''
          new_catalog = '''\t\tfor _, p := range c.Pools {\n\t\t\tif p.Enabled && c.Eligible(p, n) {\n\t\t\t\tim, _ := c.Image(p.Image)\n'''
          if new_catalog not in store_text:
              if store_text.count(old_catalog) != 1:
                  raise SystemExit("enabled Pool catalog marker missing")
              store_text = store_text.replace(old_catalog, new_catalog, 1)

          # An instance allocated before its Pool is disabled still needs its
          # image for restart/reconciliation until the instance reaches Deleted.
          sync_start = store_text.index("func (s *Store) Sync(")
          sync_end = store_text.index("func (s *Store) Drain(", sync_start)
          sync_text = store_text[sync_start:sync_end]
          active_block = '''\t\tfor _, instance := range runs {\n\t\t\tif instance.Node == name && instance.State != "Deleted" && !imageSeen[instance.Image.Digest] {\n\t\t\t\tresponse.Images = append(response.Images, instance.Image)\n\t\t\t\timageSeen[instance.Image.Digest] = true\n\t\t\t}\n\t\t}\n'''
          if active_block not in sync_text:
              marker = '''\t\truns, e := readInstances(ctx, tx)\n\t\tif e != nil {\n\t\t\treturn e\n\t\t}\n'''
              if sync_text.count(marker) != 1:
                  raise SystemExit("Sync instance read marker missing")
              sync_text = sync_text.replace(marker, marker + active_block, 1)
              store_text = store_text[:sync_start] + sync_text + store_text[sync_end:]
          store.write_text(store_text)

          cache = Path("internal/host/cache.go")
          cache_text = cache.read_text()

          # Avoid performing qemu-img inspection twice for one entry.
          old_inspect = '''\t\tif options.Verify && entry.Integrity != "unsafe" {\n\t\t\tactual, stamp, verifyErr := hashFile(full)\n\t\t\tswitch {\n\t\t\tcase verifyErr != nil:\n\t\t\t\tentry.Integrity = "unreadable"\n\t\t\t\tentry.IntegrityError = verifyErr.Error()\n\t\t\tcase actual != digest:\n\t\t\t\tentry.Integrity = "digest-mismatch"\n\t\t\t\tentry.IntegrityError = "file SHA-256 differs from its content-addressed name"\n\t\t\tcase i.inspect(ctx, full) != nil:\n\t\t\t\tinspectErr := i.inspect(ctx, full)\n\t\t\t\tentry.Integrity = "invalid-qcow2"\n\t\t\t\tentry.IntegrityError = inspectErr.Error()\n\t\t\tdefault:\n\t\t\t\tentry.Integrity = "valid"\n\t\t\t\tif i.verified == nil {\n\t\t\t\t\ti.verified = map[string]imageStamp{}\n\t\t\t\t}\n\t\t\t\ti.verified[digest] = stamp\n\t\t\t}\n'''
          new_inspect = '''\t\tif options.Verify && entry.Integrity != "unsafe" {\n\t\t\tactual, stamp, verifyErr := hashFile(full)\n\t\t\tif verifyErr != nil {\n\t\t\t\tentry.Integrity = "unreadable"\n\t\t\t\tentry.IntegrityError = verifyErr.Error()\n\t\t\t} else if actual != digest {\n\t\t\t\tentry.Integrity = "digest-mismatch"\n\t\t\t\tentry.IntegrityError = "file SHA-256 differs from its content-addressed name"\n\t\t\t} else if inspectErr := i.inspect(ctx, full); inspectErr != nil {\n\t\t\t\tentry.Integrity = "invalid-qcow2"\n\t\t\t\tentry.IntegrityError = inspectErr.Error()\n\t\t\t} else {\n\t\t\t\tentry.Integrity = "valid"\n\t\t\t\tif i.verified == nil {\n\t\t\t\t\ti.verified = map[string]imageStamp{}\n\t\t\t\t}\n\t\t\t\ti.verified[digest] = stamp\n\t\t\t}\n'''
          if new_inspect not in cache_text:
              if cache_text.count(old_inspect) != 1:
                  raise SystemExit("cache verification block missing")
              cache_text = cache_text.replace(old_inspect, new_inspect, 1)

          # Refactor the absent-cache path so references and orphan bases are
          # still audited instead of returning a healthy empty report.
          old_absent = '''\treport.Exists = exists\n\tif !exists {\n\t\tparent := filepath.Dir(i.Dir)\n\t\tif free, freeErr := filesystemFreeBytes(parent); freeErr == nil {\n\t\t\treport.FilesystemFreeBytes = free\n\t\t\treport.ImportHeadroomBytes = max(int64(0), min(report.LimitGiB*(1<<30), free-report.ReserveGiB*(1<<30)))\n\t\t}\n\t\treturn report, nil\n\t}\n\trefs, err := i.cacheReferences(ctx, options)\n\tif err != nil {\n\t\treturn report, err\n\t}\n\tentries, err := os.ReadDir(i.Dir)\n\tif err != nil {\n\t\treturn report, err\n\t}\n'''
          new_absent = '''\treport.Exists = exists\n\trefs, err := i.cacheReferences(ctx, options)\n\tif err != nil {\n\t\treturn report, err\n\t}\n\tentries := []os.DirEntry{}\n\tif exists {\n\t\tentries, err = os.ReadDir(i.Dir)\n\t\tif err != nil {\n\t\t\treturn report, err\n\t\t}\n\t}\n'''
          if new_absent not in cache_text:
              if cache_text.count(old_absent) != 1:
                  raise SystemExit("absent cache path block missing")
              cache_text = cache_text.replace(old_absent, new_absent, 1)

          if "seenDigests := map[string]bool{}" not in cache_text:
              marker = '''\tfor _, dirEntry := range entries {\n'''
              if cache_text.count(marker) != 1:
                  raise SystemExit("cache entries loop marker missing")
              cache_text = cache_text.replace(marker, '''\tseenDigests := map[string]bool{}\n\tfor _, dirEntry := range entries {\n''', 1)
          if "seenDigests[digest] = true" not in cache_text:
              marker = '''\t\tentry := CacheEntry{Digest: digest, Name: name, Modified: st.ModTime(), Integrity: "unchecked", References: uniqueSorted(refs[digest]), cachePath: full}\n'''
              if cache_text.count(marker) != 1:
                  raise SystemExit("cache entry marker missing")
              cache_text = cache_text.replace(marker, '''\t\tseenDigests[digest] = true\n''' + marker, 1)

          missing_block = '''\tfor digest, references := range refs {\n\t\tif seenDigests[digest] {\n\t\t\tcontinue\n\t\t}\n\t\tname, nameErr := imageName(digest)\n\t\tif nameErr != nil {\n\t\t\treturn report, nameErr\n\t\t}\n\t\treport.InvalidEntries++\n\t\treport.Entries = append(report.Entries, CacheEntry{\n\t\t\tDigest: digest, Name: name, Integrity: "missing",\n\t\t\tIntegrityError: "referenced image is missing from the content-addressed cache",\n\t\t\tReferences: uniqueSorted(references),\n\t\t\tBlockedReason: "restore or re-download the referenced image",\n\t\t})\n\t}\n\tif options.DiskDir != "" {\n\t\tbaseDir := filepath.Join(options.DiskDir, "base")\n\t\tbaseEntries, baseErr := os.ReadDir(baseDir)\n\t\tif baseErr != nil && !os.IsNotExist(baseErr) {\n\t\t\treturn report, baseErr\n\t\t}\n\t\tfor _, baseEntry := range baseEntries {\n\t\t\tbasePath := filepath.Join(baseDir, baseEntry.Name())\n\t\t\tbaseStat, statErr := os.Lstat(basePath)\n\t\t\tif statErr != nil {\n\t\t\t\treturn report, statErr\n\t\t\t}\n\t\t\tdigest, validName := cacheDigestFromName(baseEntry.Name())\n\t\t\tif !validName || !baseStat.Mode().IsRegular() {\n\t\t\t\treport.UnsafeEntries++\n\t\t\t\treport.Auxiliary = append(report.Auxiliary, CacheAuxEntry{Name: filepath.Join("base", baseEntry.Name()), Kind: "unsafe-base", SizeBytes: baseStat.Size(), Modified: baseStat.ModTime(), Reason: "base directory contains an invalid entry", path: basePath})\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\tif seenDigests[digest] {\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\t_, allocated := cacheFileUsage(baseStat)\n\t\t\treport.UnsafeEntries++\n\t\t\treport.Auxiliary = append(report.Auxiliary, CacheAuxEntry{Name: filepath.Join("base", baseEntry.Name()), Kind: "orphan-base", SizeBytes: baseStat.Size(), AllocatedBytes: allocated, Modified: baseStat.ModTime(), Reason: "base image has no matching private cache entry and is never auto-deleted", path: basePath})\n\t\t}\n\t}\n'''
          if missing_block not in cache_text:
              marker = '''\tsort.Slice(report.Entries, func(a, b int) bool { return report.Entries[a].Digest < report.Entries[b].Digest })\n'''
              if cache_text.count(marker) != 1:
                  raise SystemExit("cache report sort marker missing")
              cache_text = cache_text.replace(marker, missing_block + marker, 1)

          # Use the existing parent to calculate free space before the cache
          # directory has ever been created.
          old_free = '''\treport.FilesystemFreeBytes, err = filesystemFreeBytes(i.Dir)\n'''
          new_free = '''\tfilesystemPath := i.Dir\n\tif !exists {\n\t\tfilesystemPath = filepath.Dir(i.Dir)\n\t}\n\treport.FilesystemFreeBytes, err = filesystemFreeBytes(filesystemPath)\n'''
          if new_free not in cache_text:
              if cache_text.count(old_free) != 1:
                  raise SystemExit("cache free-space marker missing")
              cache_text = cache_text.replace(old_free, new_free, 1)

          if "func managedUniqueAllocatedBytes(" not in cache_text:
              helper = '''func managedUniqueAllocatedBytes(roots ...string) (int64, error) {\n\tseen := map[string]bool{}\n\tvar total int64\n\tfor _, root := range roots {\n\t\tif root == "" {\n\t\t\tcontinue\n\t\t}\n\t\terr := filepath.WalkDir(root, func(path string, entry os.DirEntry, walkErr error) error {\n\t\t\tif walkErr != nil {\n\t\t\t\tif os.IsNotExist(walkErr) {\n\t\t\t\t\treturn nil\n\t\t\t\t}\n\t\t\t\treturn walkErr\n\t\t\t}\n\t\t\tif entry.Type()&os.ModeSymlink != 0 {\n\t\t\t\treturn fmt.Errorf("symlink in managed cache/storage tree: %s", path)\n\t\t\t}\n\t\t\tif entry.IsDir() {\n\t\t\t\treturn nil\n\t\t\t}\n\t\t\tif entry.Name() == "image-cache.lock" || entry.Name() == ".runnerloom-cache-policy.json" {\n\t\t\t\treturn nil\n\t\t\t}\n\t\t\tinfo, infoErr := entry.Info()\n\t\t\tif infoErr != nil {\n\t\t\t\treturn infoErr\n\t\t\t}\n\t\t\tif !info.Mode().IsRegular() {\n\t\t\t\treturn nil\n\t\t\t}\n\t\t\t_, allocated := cacheFileUsage(info)\n\t\t\tkey := path\n\t\t\tif raw, ok := info.Sys().(*syscall.Stat_t); ok {\n\t\t\t\tkey = fmt.Sprintf("%d:%d", uint64(raw.Dev), uint64(raw.Ino))\n\t\t\t}\n\t\t\tif !seen[key] {\n\t\t\t\tseen[key] = true\n\t\t\t\ttotal += allocated\n\t\t\t}\n\t\t\treturn nil\n\t\t})\n\t\tif err != nil && !os.IsNotExist(err) {\n\t\t\treturn 0, err\n\t\t}\n\t}\n\treturn total, nil\n}\n\n'''
              marker = "func syncDirectory(path string) error {\n"
              if marker not in cache_text:
                  raise SystemExit("managed byte helper marker missing")
              cache_text = cache_text.replace(marker, helper + marker, 1)
          old_tail = '''\treport.ImportHeadroomBytes = min(logical, physical)\n\treport.Healthy = report.InvalidEntries == 0 && report.UnsafeEntries == 0\n'''
          new_tail = '''\treport.ImportHeadroomBytes = min(logical, physical)\n\treport.ManagedUniqueBytes, err = managedUniqueAllocatedBytes(i.Dir, options.DiskDir)\n\tif err != nil {\n\t\treturn report, err\n\t}\n\treport.Healthy = report.InvalidEntries == 0 && report.UnsafeEntries == 0\n'''
          if new_tail not in cache_text:
              if cache_text.count(old_tail) != 1:
                  raise SystemExit("aggregate cache report marker missing")
              cache_text = cache_text.replace(old_tail, new_tail, 1)

          old_prunable = '''\t\tif entry.Integrity == "valid" && len(entry.References) == 0 && entry.LinkCount == entry.expectedLinkCnt {\n'''
          new_prunable = '''\t\tif entry.LinkCount != entry.expectedLinkCnt {\n\t\t\treport.UnsafeEntries++\n\t\t}\n\t\tif entry.Integrity == "valid" && len(entry.References) == 0 && entry.LinkCount == entry.expectedLinkCnt {\n'''
          if new_prunable not in cache_text:
              if cache_text.count(old_prunable) != 1:
                  raise SystemExit("hard-link safety marker missing")
              cache_text = cache_text.replace(old_prunable, new_prunable, 1)

          old_qdir = '''\toptions.Verify = true\n\tif err := core.PrivateDir(i.Dir); err != nil {\n\t\treturn CacheQuarantineReport{}, err\n\t}\n\tvar lock *core.Lock\n'''
          new_qdir = '''\toptions.Verify = true\n\texists, err := checkExistingPrivateDirectory(i.Dir)\n\tif err != nil {\n\t\treturn CacheQuarantineReport{}, err\n\t}\n\tif !exists {\n\t\treturn CacheQuarantineReport{}, errors.New("image cache directory does not exist")\n\t}\n\tvar lock *core.Lock\n'''
          if new_qdir not in cache_text:
              if cache_text.count(old_qdir) != 1:
                  raise SystemExit("quarantine dry-run marker missing")
              cache_text = cache_text.replace(old_qdir, new_qdir, 1)

          old_qbase = '''\tif !apply {\n\t\treturn result, nil\n\t}\n\tbaseRemoved, err := removeStaleBaseLink(*entry)\n'''
          new_qbase = '''\tif entry.cachePath == "" {\n\t\treturn result, errors.New("a missing cache image cannot be quarantined")\n\t}\n\tif !apply {\n\t\treturn result, nil\n\t}\n\townedBase := *entry\n\townedBase.StaleBaseLink = ownedBase.BaseLink\n\tbaseRemoved, err := removeStaleBaseLink(ownedBase)\n'''
          if new_qbase not in cache_text:
              if cache_text.count(old_qbase) != 1:
                  raise SystemExit("quarantine owned-base marker missing")
              cache_text = cache_text.replace(old_qbase, new_qbase, 1)
          cache.write_text(cache_text)

          # Ensure version/docs integration exists even after a lost earlier push.
          Path("VERSION").write_text("0.1.0-rc.3\n")
          checker = Path("scripts/check-docs.py")
          checker_text = checker.read_text()
          cache_line = '    ROOT / "docs" / "CACHE_MANAGEMENT.ja.md",\n'
          if cache_line not in checker_text:
              marker = '    ROOT / "docs" / "TROUBLESHOOTING.ja.md",\n'
              if marker not in checker_text:
                  raise SystemExit("documentation checker marker missing")
              checker.write_text(checker_text.replace(marker, marker + cache_line, 1))

          changelog = Path("CHANGELOG.md")
          change_text = changelog.read_text()
          if "## 0.1.0-rc.3" not in change_text:
              marker = "# Changelog\n"
              entry = '''# Changelog\n\n## 0.1.0-rc.3 - 2026-09-11\n\n### Added\n\n- Golden Image cache status, full verification, dry-run pruning and explicit corruption quarantine.\n- Enabled-Pool, active-Instance, Node catalog, VM manifest, base hard-link and real qcow2 backing-reference reconciliation.\n- Aggregate cache/VM-storage allocation without hard-link double counting and a physical import reserve.\n- Missing referenced Image and orphan-base reporting, cache lifecycle documentation and regression coverage.\n\n### Safety\n\n- Mutating operations require an offline Controller/Agent process lock and repeat digest, qcow2, inode and hard-link checks immediately before removal.\n- Unknown files, active or uncertain VM state, unexpected links and invalid metadata remain protected.\n'''
              if marker not in change_text:
                  raise SystemExit("CHANGELOG marker missing")
              changelog.write_text(change_text.replace(marker, entry, 1))

          docs_patches = [
              ("README.md", "## 安全性と対応範囲\n", "## Image cacheの管理\n\nGolden Image cacheの容量、完全検証、安全なdry-run prune、破損時のquarantineは [cache管理ガイド](docs/CACHE_MANAGEMENT.ja.md) を参照してください。\n\n## 安全性と対応範囲\n"),
              ("docs/README.md", "## 設計・安全性・検証\n", "## Cacheと容量\n\nGolden Imageの保存場所、容量、prune、quarantine: [CACHE_MANAGEMENT.ja.md](CACHE_MANAGEMENT.ja.md)\n\n## 設計・安全性・検証\n"),
              ("docs/QUICKSTART.ja.md", "## 6. GitHub接続を確認し、serviceを起動する\n", "### 5-4. Cache容量を確認する\n\n```bash\nsudo runnerloom cache status --node-config \"$RL_NODE_STATE/agent.json\" --json\n```\n\n詳細は [Golden Image cacheの管理](CACHE_MANAGEMENT.ja.md) を参照してください。\n\n## 6. GitHub接続を確認し、serviceを起動する\n"),
              ("docs/OPERATIONS.ja.md", "## Controller DBの安全な整理\n", "## Golden Image cacheの点検と整理\n\n`cache status`と`cache verify`は稼働中にも確認できます。`cache prune`と`cache quarantine`はdry-runを読み、対象serviceを停止してから`--apply`します。詳細は [CACHE_MANAGEMENT.ja.md](CACHE_MANAGEMENT.ja.md) を参照してください。\n\n## Controller DBの安全な整理\n"),
              ("docs/TROUBLESHOOTING.ja.md", "## 調査情報を保存する\n", "## 14. Image cacheが満杯または破損している\n\n`cache status --verify`で容量、参照、integrityを確認します。整理はdry-run後にserviceを停止して`cache prune --apply`、破損は`cache quarantine DIGEST --apply`で隔離します。詳細は [CACHE_MANAGEMENT.ja.md](CACHE_MANAGEMENT.ja.md) を参照してください。\n\n## 調査情報を保存する\n"),
          ]
          for name, marker, replacement in docs_patches:
              p = Path(name)
              doc = p.read_text()
              if "CACHE_MANAGEMENT.ja.md" in doc:
                  continue
              if marker not in doc:
                  raise SystemExit(f"documentation marker missing in {name}")
              p.write_text(doc.replace(marker, replacement, 1))

          cache_doc = Path("docs/CACHE_MANAGEMENT.ja.md")
          cache_doc_text = cache_doc.read_text()
          if "orphan-base" not in cache_doc_text:
              marker = "## Cacheが満杯になった場合\n"
              note = "## 不足Imageと孤立baseの扱い\n\n現在のPool、Node catalog、未完了VMが参照するdigestがprivate cacheにない場合、`cache verify`は`missing`として失敗します。`<disk-dir>/base`だけに残ったImageは`orphan-base`として表示し、自動削除しません。先にVM manifestとoverlayの実状態を照合してください。\n\n"
              if marker not in cache_doc_text:
                  raise SystemExit("cache guide marker missing")
              cache_doc_text = cache_doc_text.replace(marker, note + marker, 1)
          cache_doc_text = cache_doc_text.replace(
              "`cache status`では、cache使用量と実filesystemの空き、次のimportに使用できる小さい方のheadroomを表示します。",
              "`cache status`では、cache使用量、NodeのVM storageをhard linkで重複計上しないaggregate使用量、実filesystemの空き、次のimportに使用できる小さい方のheadroomを表示します。",
          )
          cache_doc.write_text(cache_doc_text)

          core_test = Path("internal/core/cache_catalog_test.go")
          core_test.write_text(r'''package core

import (
	"context"
	"strings"
	"testing"
)

func applyCacheCatalogConfig(t *testing.T, store *Store, config Config) {
	t.Helper()
	plan, err := store.Plan(context.Background(), config)
	if err != nil {
		t.Fatal(err)
	}
	if _, err = store.Apply(context.Background(), plan.ID); err != nil {
		t.Fatal(err)
	}
}

func cacheCatalogObservation(config Config, sequence int64, digests []string) Observation {
	return Observation{Node: "node-a", BootID: "boot", Sequence: sequence, Ready: true, Isolation: true, Ceiling: config.Nodes[0].LocalCeiling, FreeDiskGiB: 500, Digests: digests, Instances: []VMReport{}}
}

func TestNodeCatalogExcludesDisabledPoolImages(t *testing.T) {
	store, err := OpenStore(t.TempDir())
	if err != nil {
		t.Fatal(err)
	}
	defer store.Close()
	config := Example()
	disabledDigest := "sha256:" + strings.Repeat("b", 64)
	config.Images = append(config.Images, Image{Name: "disabled-image", Digest: disabledDigest, MinimumRootGiB: 20})
	config.Pools[1].Image = "disabled-image"
	config.Pools[1].Enabled = false
	config.Reservations = []Reservation{}
	applyCacheCatalogConfig(t, store, config)
	response, err := store.Sync(context.Background(), "node-a", cacheCatalogObservation(config, 1, nil))
	if err != nil {
		t.Fatal(err)
	}
	for _, image := range response.Images {
		if image.Digest == disabledDigest {
			t.Fatal("disabled Pool image remained in the Node catalog")
