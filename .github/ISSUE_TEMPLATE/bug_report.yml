name: Bug report / 不具合報告
description: Report reproducible behavior without posting secrets.
body:
  - type: markdown
    attributes:
      value: 'Do not include tokens, invitation files, private keys, JIT configuration, repository secrets or raw state databases. Security reports: see SECURITY.md.'
  - type: textarea
    id: version
    attributes:
      label: Version and host / バージョンと環境
      description: 'runnerloom version --json, Ubuntu/kernel/libvirt versions and installation method.'
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps / 再現手順
      description: Minimal command sequence with secrets and private identifiers removed.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior / 期待と実際
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized diagnostics / 秘密情報を除いた診断
      description: Include error codes and whether any VM/resources remained. Do not blindly paste raw guest logs.
